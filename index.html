<script>(function(){
  /* Animations follow the device's reduced-motion setting until the reader chooses; the choice is remembered. */

    b.addEventListener("click", function(e){ var t = e.target.closest ? e.target.closest("[data-m]") : null; if (t) M.set(t.getAttribute("data-m") === "on"); });

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Agent Up, Dewi! An interactive anime comic about Microsoft 365 Copilot, Copilot Studio, MCP and A2A for a new Contoso Modern Work engineer. Built from Microsoft Learn.">
<title>Agent Up, Dewi! A Contoso onboarding comic</title>
<style>:root{
  color-scheme: dark;
  --bg:#0a0f1f; --bg2:#0f1730; --panel:#131c3a; --panel2:#18234a; --ink:#eef2ff; --muted:#aab6dd; --dim:#7d89b3;
  --line:#2b3a6e; --teal:#19d3c5; --violet:#8b6cff; --blue:#4f8cff; --amber:#ffb547; --orange:#ff8a3d; --pink:#ff5fa2;
  --bubble:#ffffff; --bink:#151a2e; --cap:#fff1a8;
  --c-sari:#2f7cf6; --c-nova:#7b5cff; --c-orbi:#0fb3a6; --c-kubo:#f07a2a; --c-lina:#d9468f; --c-oni:#8e44ad; --c-vague:#6b7a8f; --c-muncher:#c0392b;
  --r:18px; --shadow:0 18px 50px rgba(0,0,0,.45);
  --font: "Segoe UI", "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Black", "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#0a0f1f; } }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 10% -10%, rgba(139,108,255,.20), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, rgba(25,211,197,.16), transparent 60%),
  radial-gradient(800px 600px at 50% 120%, rgba(79,140,255,.14), transparent 60%), var(--bg);}
a{color:var(--teal)} a:hover{color:#7ff3ea}
button{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(10,15,31,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand img{width:38px;height:auto;filter:drop-shadow(0 0 8px rgba(25,211,197,.6))}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#9ff6ee 50%,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-align:start}
.top .sp{flex:1}
.tbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--teal);color:#fff}
.tbtn.hot{background:linear-gradient(90deg,var(--violet),var(--blue));border:0;color:#fff}
.progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--violet),var(--pink));z-index:60;transition:width .4s}
select.chap{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:600;max-width:340px}

/* cover */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 120px}
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:3px solid #0b1022;aspect-ratio:3/2;max-height:78vh;width:100%;margin:6px auto 0;background:#000}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,24,.55) 0%,rgba(6,10,24,0) 34%,rgba(6,10,24,0) 62%,rgba(6,10,24,.85) 100%)}
.hero .title{position:absolute;inset-inline:0;top:4%;text-align:center;padding:0 4%}
.hero h1{font-family:var(--display);font-size:clamp(34px,6.4vw,86px);line-height:.95;margin:0;letter-spacing:1px;color:#fff;
  text-shadow:0 4px 0 #2a1d77,0 8px 0 #12093d,0 0 28px rgba(139,108,255,.85),0 0 60px rgba(25,211,197,.55);transform:rotate(-2deg)}
.hero h1 span{display:inline-block;animation:bounceIn .9s cubic-bezier(.2,1.6,.4,1) both}
.hero .sub{margin-top:14px;display:inline-block;background:rgba(10,15,31,.72);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 18px;font-weight:700;font-size:clamp(12px,1.5vw,17px)}
.hero .ctas{position:absolute;inset-inline:0;bottom:5%;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.big{font-size:17px;padding:13px 24px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#0b1022;background:var(--teal);border-radius:999px;padding:4px 10px}
.sec{margin:34px 0 10px;display:flex;align-items:baseline;gap:12px}
.sec h2{font-family:var(--display);font-size:28px;margin:0}
.sec p{margin:0;color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cc{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.cc img{width:84px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:bob 3.2s ease-in-out infinite}
.cc:nth-child(2) img{animation-delay:.5s}.cc:nth-child(3) img{animation-delay:1s}.cc:nth-child(4) img{animation-delay:1.5s}
.cc h3{margin:0 0 4px;font-size:18px}.cc p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}
.vil{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.vc{display:flex;gap:12px;align-items:center;background:#1a1235;border:1px solid #3d2a6e;border-radius:var(--r);padding:12px}
.vc img{width:92px;height:110px;object-fit:cover;border-radius:12px;border:2px solid #000}
.vc h3{margin:0 0 4px}.vc p{margin:0;color:#cdbcf7;font-size:13.5px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ch{position:relative;border-radius:var(--r);overflow:hidden;min-height:190px;cursor:pointer;border:2px solid #0b1022;box-shadow:var(--shadow);background:#000;text-align:start;color:#fff;padding:0}
.ch .im{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s}
.ch:hover .im,.ch:focus-visible .im{transform:scale(1.07)}
.ch .gr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,20,.05),rgba(5,8,20,.92) 72%)}
.ch .tx{position:absolute;inset-inline:14px;bottom:12px}
.ch .n{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--teal)}
.ch h3{margin:2px 0 4px;font-size:18px;line-height:1.2}
.ch .d{font-size:12.5px;color:#d8def6}
.ch .du{position:absolute;inset-inline-end:10px;top:10px;background:rgba(10,15,31,.8);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px}
.how kbd{background:#0b1022;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:#fff;font-family:var(--mono);font-size:12px}
.foot{margin-top:34px;color:var(--dim);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}

/* reader */
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:8px 0 12px}
.chead .num{font-family:var(--display);font-size:15px;color:var(--teal);letter-spacing:.6px;text-transform:uppercase}
.chead h2{margin:0;font-size:clamp(18px,2.4vw,26px);flex:1 1 420px}
.chead .du{font-weight:800;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chead .goal{flex-basis:100%;color:var(--muted);font-size:14px;margin-top:-4px}
.stage{position:relative}
.panel{position:relative;aspect-ratio:3/2;width:100%;border-radius:22px;overflow:hidden;border:4px solid #05070f;box-shadow:0 0 0 2px rgba(255,255,255,.12),var(--shadow);background:#000;cursor:pointer;user-select:none}
.panel img.pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.kb-a{animation:kbA 18s ease-in-out infinite alternate}
.kb-b{animation:kbB 18s ease-in-out infinite alternate}
.kb-c{animation:kbC 20s ease-in-out infinite alternate}
@keyframes kbA{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2.5%,-1.5%)}}
@keyframes kbB{from{transform:scale(1.1) translate(2%,1%)}to{transform:scale(1.02) translate(-1%,0)}}
@keyframes kbC{from{transform:scale(1.08) translate(-3%,0)}to{transform:scale(1.08) translate(3%,-1%)}}
.cap{position:absolute;inset-inline-start:1.4%;bottom:2.2%;max-width:62%;background:var(--cap);color:#2a2410;border:3px solid var(--bink);border-radius:6px;padding:7px 12px;font-weight:700;font-size:clamp(11px,1.25vw,15px);line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.55);transform:skew(-2deg);z-index:6}
.bub{position:absolute;z-index:7;background:var(--bubble);color:var(--bink);border:3px solid var(--bink);border-radius:20px;padding:9px 13px 10px;font-size:clamp(11px,1.32vw,16.5px);line-height:1.32;font-weight:650;box-shadow:4px 5px 0 rgba(0,0,0,.45);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.bub.hid{opacity:0;transform:scale(.6) translateY(10px);pointer-events:none}
.bub .who{display:inline-block;font-size:.72em;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;border-radius:999px;padding:1px 8px;margin-bottom:3px;margin-inline-end:6px}
.bub .tl{position:absolute;width:16px;height:16px;background:var(--bubble);border:3px solid var(--bink);transform:rotate(45deg)}
.bub .tl.b{bottom:-10px;left:var(--at);margin-left:-8px;border-top:0;border-left:0}
.bub .tl.t{top:-10px;left:var(--at);margin-left:-8px;border-bottom:0;border-right:0}
.bub .tl.l{left:-10px;top:var(--at);margin-top:-8px;border-top:0;border-right:0}
.bub .tl.r{right:-10px;top:var(--at);margin-top:-8px;border-bottom:0;border-left:0}
.bub.v{background:#f6efff}.bub.v .tl{background:#f6efff}
.who.sari{background:var(--c-sari)}.who.nova{background:var(--c-nova)}.who.orbi{background:var(--c-orbi)}.who.kubo{background:var(--c-kubo)}.who.lina{background:var(--c-lina)}.who.oni{background:var(--c-oni)}.who.vague{background:var(--c-vague)}.who.muncher{background:var(--c-muncher)}
.hint{position:absolute;inset-inline-end:1.4%;bottom:2.2%;z-index:8;background:rgba(10,15,31,.78);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;animation:blink 1.6s ease-in-out infinite}
.dlg{display:none}
/* fx */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(160,255,248,.55),rgba(139,108,255,.25) 40%,transparent 70%);mix-blend-mode:screen;animation:glow 2.8s ease-in-out infinite}
.pulse{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:3px solid rgba(160,255,248,.9);animation:ring 2.2s ease-out infinite}
.fdot{position:absolute;width:1.2%;aspect-ratio:1;border-radius:50%;background:#bffcf6;box-shadow:0 0 12px 4px rgba(25,211,197,.9);transform:translate(-50%,-50%);animation:fly var(--d,2.4s) linear infinite}
.conf{position:absolute;top:-6%;width:1%;height:2.2%;border-radius:2px;animation:fall var(--d,4s) linear infinite;opacity:.9}
@keyframes glow{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
@keyframes fly{0%{left:var(--x1);top:var(--y1);opacity:0}10%{opacity:1}90%{opacity:1}100%{left:var(--x2);top:var(--y2);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120vh) rotate(540deg)}}
@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}

/* info cards */
.sheet{position:relative;border-radius:22px;border:4px solid #05070f;box-shadow:0 0 0 2px rgba(255,255,255,.10),var(--shadow);background:
  linear-gradient(180deg,rgba(24,35,74,.96),rgba(15,22,48,.98)),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/14px 14px;
  padding:22px 24px;min-height:min(62vh,640px);animation:popIn .45s ease both}
.sheet h3.t{font-family:var(--display);font-size:clamp(20px,2.6vw,30px);margin:4px 0 14px;letter-spacing:.3px}
.kick{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#0b1022;background:var(--amber);border-radius:6px;padding:3px 9px;transform:skew(-6deg)}
.cardg{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:22px;align-items:start}
.aside{position:sticky;top:90px;text-align:center}
.aside img{width:100%;max-width:190px;height:auto;max-height:260px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));animation:bob 3.4s ease-in-out infinite}
.aside .say{position:relative;margin-top:10px;background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 10px;font-size:13.5px;font-weight:700;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
.aside .say:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-8px;width:14px;height:14px;background:#fff;border:3px solid var(--bink);border-bottom:0;border-right:0;transform:rotate(45deg)}
.body{font-size:16px;line-height:1.6;color:#e3e9ff}
.body h4{margin:12px 0 6px;font-size:17px;color:#a8fff6}
.body ul,.body ol{margin:6px 0 10px;padding-inline-start:22px}
.body li{margin:5px 0}
.body li b{color:#fff}
.body i{color:#ffd98a;font-style:normal}
.body code,.tbl code{font-family:var(--mono);font-size:.9em;background:#0b1022;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#9ff6ee}
.note{background:rgba(255,181,71,.12);border:1px dashed rgba(255,181,71,.6);border-radius:12px;padding:10px 12px;color:#ffe2b0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{background:rgba(10,15,31,.45);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.tblw{overflow:auto;border-radius:14px;border:1px solid var(--line);margin:6px 0 12px}
table.tbl{border-collapse:collapse;width:100%;font-size:14.5px;min-width:640px}
.tbl th{background:#1d2a5a;color:#fff;text-align:start;padding:10px 12px;font-size:13px;letter-spacing:.3px;position:sticky;top:0}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;color:#dfe6ff;line-height:1.45}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.tbl td:first-child{font-weight:700;color:#fff}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.scol{background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.scol h4{margin:4px 0 10px;font-size:16.5px;color:#a8fff6}
.scol ol{counter-reset:s;list-style:none;margin:0;padding:0}
.scol li{counter-increment:s;position:relative;padding:6px 0 8px 38px;line-height:1.5;font-size:15px;border-top:1px dashed rgba(255,255,255,.08)}
.scol li:first-child{border-top:0}
.scol li:before{content:counter(s);position:absolute;inset-inline-start:0;top:6px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(139,108,255,.25)}
.scol.b li:before{background:linear-gradient(135deg,var(--teal),#0a8f86);box-shadow:0 0 0 3px rgba(25,211,197,.2)}
pre.code{position:relative;background:#070b18;border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:auto;font-family:var(--mono);font-size:14px;line-height:1.55;color:#d7e3ff;margin:4px 0 12px}
pre.code .k{color:#ff9bd2}pre.code .s{color:#9ff6ee}pre.code .c{color:#7d89b3}pre.code .h{color:#ffd98a;font-weight:700}
.copy{position:absolute;inset-inline-end:10px;top:10px;font-size:12px;padding:5px 10px}
.arch{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 40%,rgba(79,140,255,.08),transparent 70%);border-radius:14px}
.arch .grp rect:first-child{fill:rgba(255,255,255,.025);stroke-width:2;stroke-dasharray:7 6}
.arch .grp .tab{stroke:none}
.arch .gt{font-size:13px;font-weight:800;fill:#0b1022}
.arch .gt2{font-size:13px;font-weight:700;fill:#aab6dd}
.arch .mono{font-family:var(--mono);font-size:14px;fill:#d7e3ff;white-space:pre}
.arch .nd rect{stroke-width:2}
.arch .nd:hover rect,.arch .nd:focus rect{stroke-width:3.5;filter:drop-shadow(0 0 8px rgba(160,255,248,.6))}
.arch .nt{font-size:13.5px;font-weight:800;fill:#fff}
.arch .nt.big{font-size:15px}
.arch .ns{font-size:11.2px;fill:#c7d2f5}
.arch .gl{color:#d9e4ff}
.arch .k-m365 rect{fill:#13265a;stroke:#4f8cff}.arch .grp.k-m365 rect:first-child{stroke:#4f8cff}.arch .grp.k-m365 .tab{fill:#4f8cff}
.arch .k-studio rect{fill:#24184f;stroke:#8b6cff}.arch .grp.k-studio rect:first-child{stroke:#8b6cff}.arch .grp.k-studio .tab{fill:#a993ff}
.arch .k-proto rect{fill:#0d3236;stroke:#19d3c5}.arch .grp.k-proto rect:first-child{stroke:#19d3c5}.arch .grp.k-proto .tab{fill:#19d3c5}
.arch .k-gov rect{fill:#33270c;stroke:#ffb547}.arch .grp.k-gov rect:first-child{stroke:#ffb547}.arch .grp.k-gov .tab{fill:#ffb547}
.arch .k-ext rect{fill:#3a1e0d;stroke:#ff8a3d}.arch .grp.k-ext rect:first-child{stroke:#ff8a3d}.arch .grp.k-ext .tab{fill:#ff8a3d}
.arch .k-user rect{fill:#1d2438;stroke:#c7d2f5}
.arch .k-q rect{fill:#102043;stroke:#ffd98a;stroke-dasharray:5 3}
.arch .eg{fill:none;stroke-width:2.4;stroke:#7fb2ff}
.arch .eg.flow{stroke:#7fb2ff}.arch .eg.flow2{stroke:#b9a6ff}.arch .eg.flow3{stroke:#4fe6d8}.arch .eg.gov{stroke:#ffb547;stroke-width:1.6}
.arch .eg.dash{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
.arch .arh{fill:#c9d8ff}
.arch .dt{fill:#e9fffd;filter:drop-shadow(0 0 5px #19d3c5)}
.arch .dt.flow2{fill:#efe9ff;filter:drop-shadow(0 0 5px #8b6cff)}
.arch .el rect{fill:#0b1022;stroke:#3a4c8c}
.arch .el text{font-size:11.5px;font-weight:800;fill:#ffe7a8;text-anchor:middle}
.arch .bd circle{fill:#ff5fa2;stroke:#fff;stroke-width:2}
.arch .bd text{font-size:13px;font-weight:900;fill:#fff;text-anchor:middle}
.arch .bd{animation:bdg 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.arch .pop{animation:popIn .5s ease both}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes bdg{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}}
.cap2{color:var(--muted);font-size:14.5px;line-height:1.55;margin:10px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* villain */
.vgrid{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:22px;align-items:start}
.vimg{position:relative}
.vimg img{width:100%;border-radius:16px;border:3px solid #000;box-shadow:0 0 0 3px #8e44ad,0 0 40px rgba(142,68,173,.5);animation:shake 3.5s ease-in-out infinite}
.vname{font-family:var(--display);font-size:24px;color:#e4c8ff;margin:10px 0 0;text-align:center}
.attack{position:relative;background:#f6efff;color:#2a1240;border:3px solid #120822;border-radius:20px;padding:12px 16px;font-weight:800;font-size:16.5px;box-shadow:4px 5px 0 rgba(0,0,0,.45);margin-bottom:16px}
.attack:before{content:"VILLAIN";position:absolute;top:-12px;inset-inline-start:14px;background:#8e44ad;color:#fff;font-size:11px;letter-spacing:1px;border-radius:999px;padding:2px 8px}
.counter h4{margin:0 0 8px;color:#a8fff6}
.counter li{margin:8px 0;line-height:1.55}
@keyframes shake{0%,92%,100%{transform:rotate(0)}94%{transform:rotate(-2deg)}96%{transform:rotate(2deg)}98%{transform:rotate(-1deg)}}
/* quiz */
.q{background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.q p{margin:0 0 10px;font-weight:700;font-size:16px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:start;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:#2fd38a;background:rgba(47,211,138,.15)}
.opt.no{border-color:#ff5f6d;background:rgba(255,95,109,.12)}
.why{display:none;margin-top:10px;font-size:14px;color:#cfe;line-height:1.5}
.why.on{display:block;animation:popIn .3s ease both}
.score{float:inline-end;font-weight:900;color:var(--amber)}
/* cta / recap */
.ctab{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.recap{counter-reset:r;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0 16px;padding:0;list-style:none}
.recap li{display:flex;gap:10px;align-items:flex-start;background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.45}
.recap li b{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff}
/* nav + sources */
.nav{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.nav .pg{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#33427a;cursor:pointer;padding:0}
.dots button.on{background:var(--teal);box-shadow:0 0 0 3px rgba(25,211,197,.25)}
.srcs{margin-top:10px;background:rgba(10,15,31,.55);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.srcs b{font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.srcs ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.srcs li a{display:inline-block;font-size:13px;text-decoration:none;color:#cfe;background:#0e1938;border:1px solid #2a3d7a;border-radius:999px;padding:4px 10px}
.srcs li a:hover{border-color:var(--teal);color:#fff}
.srcs li span{color:var(--dim);font-size:11.5px;margin-inline-start:4px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:70;background:linear-gradient(90deg,var(--violet),var(--blue));color:#fff;font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);animation:popIn .3s ease both}
/* guide */
.guide{position:fixed;inset-inline-end:16px;bottom:14px;z-index:50;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.guide img{width:86px;height:auto;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));pointer-events:auto;cursor:pointer}
.guide .gtip{max-width:260px;background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 11px;font-size:13px;font-weight:700;box-shadow:3px 4px 0 rgba(0,0,0,.45);margin-bottom:46px;pointer-events:auto}
.guide.min .gtip{display:none}
/* sources page */
.sgrp{margin:18px 0}
.sgrp h3{margin:0 0 8px;color:#a8fff6}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slist li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.slist li a{font-weight:700;text-decoration:none}
.slist li .m{display:block;color:var(--dim);font-size:12.5px;margin-top:3px;word-break:break-all}
@media (max-width:860px){
  .cardg,.vgrid,.two,.steps{grid-template-columns:1fr}
  .aside{position:static;display:flex;gap:12px;align-items:center;text-align:start}
  .aside img{max-width:90px}
  .aside .say:before{display:none}
  .opts{grid-template-columns:1fr}
  .panel .bub{display:none}
  .dlg{display:block;margin-top:10px}
  .dlg .line{background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 12px;margin:8px 0;font-weight:650;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
  .dlg .line.hid{display:none}
  .cap{max-width:92%}
  .guide img{width:62px}.guide .gtip{display:none}
  .brand small{display:none}
  select.chap{max-width:150px}
}
html.rm *,html.rm *:before,html.rm *:after{animation:none!important;transition:none!important}
html.rm .arch .dt{display:none}
/* ---------- auto-play ---------- */
.tbtn.auto{position:relative;overflow:hidden}
.tbtn.auto .ai{font-size:11px;line-height:1}
.tbtn.auto .ap{position:absolute;inset-inline-start:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,#ffe27a,#19d3c5);pointer-events:none}
.tbtn.auto .ap.wait{width:100%;background:linear-gradient(90deg,transparent,#19d3c5,transparent) no-repeat;background-size:40% 100%;animation:apw 1.3s linear infinite}
@keyframes apw{from{background-position:-40% 0}to{background-position:140% 0}}
body.autoon .tbtn.auto{background:linear-gradient(90deg,#ff5fa2,#8b6cff);border-color:transparent;color:#fff}
.tbtn.spd{min-width:48px;justify-content:center;padding-inline:10px}
/* ---------- traffic flow ---------- */
.tfhost{position:sticky;top:var(--hdrh,72px);z-index:6;margin:12px 0 10px;background:rgba(9,13,28,.95);border:1px solid var(--line);border-radius:14px;padding:8px 12px 10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tfbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tfl{font-size:11.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#9ff6ee;margin-inline-end:4px}
.tfb{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tfb:hover,.tfs:hover{border-color:#9ff6ee}
.tfsteps{display:flex;gap:5px;flex-wrap:wrap}
.tfs{min-width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:#0b1022;color:#c7d2f5;font-weight:900;font-size:12px;cursor:pointer;padding:0 6px}
.tfs.done{background:#1b2a55;color:#fff}
.tfs.on{background:linear-gradient(135deg,#ff5fa2,#8b6cff);color:#fff;border-color:transparent;box-shadow:0 0 0 3px rgba(255,95,162,.25)}
.tfs.all{padding:0 10px}
.tfcap{margin-top:7px;font-size:14.5px;line-height:1.5;color:#e9efff;min-height:44px}
.tfcap b{display:inline-block;background:#ffe27a;color:#0b1022;border-radius:6px;padding:1px 7px;margin-inline-end:8px;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;vertical-align:1px}
.arch.tf .dt{opacity:0;transition:opacity .4s}
.arch.tf.all .dt{opacity:1}
.arch.tf .eg{opacity:.2;transition:opacity .35s,stroke-width .35s}
.arch.tf .eg.was{opacity:.55}
.arch.tf .eg.on{opacity:1;stroke-width:3.6;stroke-dasharray:10 7;animation:dash .8s linear infinite}
.arch.tf .eg.on.flow{filter:drop-shadow(0 0 5px rgba(79,140,255,.9))}
.arch.tf .eg.on.flow2{filter:drop-shadow(0 0 5px rgba(139,108,255,.9))}
.arch.tf .eg.on.flow3{filter:drop-shadow(0 0 5px rgba(25,211,197,.9))}
.arch.tf .eg.on.gov{filter:drop-shadow(0 0 5px rgba(255,181,71,.9));stroke-width:2.6}
.arch.tf .el{opacity:.35;transition:opacity .35s}
.arch.tf .el.was,.arch.tf .el.on{opacity:1}
.arch.tf .el.on rect{stroke:#ffe27a;stroke-width:2}
.arch.tf .nd>*{transition:opacity .35s}
.arch.tf:not(.all) .nd:not(.on):not(.was)>*{opacity:.38}
.arch.tf:not(.all) .nd.was>*{opacity:.8}
.arch.tf .nd.on rect{stroke-width:3.6;filter:drop-shadow(0 0 10px rgba(255,226,122,.6))}
.arch.tf .bd{opacity:.4;transition:opacity .35s}
.arch.tf .bd.on{opacity:1}
.arch.tf.all .eg,.arch.tf.all .el,.arch.tf.all .bd,.arch.tf.all .nd>*{opacity:1}
.arch .pk{pointer-events:none}
.arch .pk .halo{fill:rgba(160,255,248,.3);transform-box:fill-box;transform-origin:center;animation:pkh .7s ease-in-out infinite alternate}
.arch .pk .core{fill:#fff;stroke-width:3}
.arch .pk.flow .core{stroke:#4f8cff}.arch .pk.flow2 .core{stroke:#8b6cff}.arch .pk.flow3 .core{stroke:#19d3c5}.arch .pk.gov .core{stroke:#ffb547}
.arch .pk.rev .core{fill:#ffe27a}
.arch .pk.rev .halo{fill:rgba(255,226,122,.32)}
.arch .pk .tag rect{fill:#0b1022;stroke:#ffe27a;stroke-width:1.3}
.arch .pk .tag text{font-size:11px;font-weight:800;fill:#ffe27a}
.arch .pk.arrive .halo{animation:pka .32s ease-out forwards}
@keyframes pkh{from{transform:scale(.75);opacity:.6}to{transform:scale(1.3);opacity:1}}
@keyframes pka{to{transform:scale(2.6);opacity:0}}
@media (max-width:860px){
  .top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .tbtn.auto .al{display:none}
  .tfhost{position:static}
  .tfcap{font-size:13.5px}
}
@media (max-width:1180px) and (min-width:861px){
  .brand small{display:none}
  select.chap{max-width:230px}
  .top{gap:10px}
}
.mbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:max-content;max-width:min(780px,94vw);background:#101833;border:2px solid #ffe27a;border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);color:#fff;font-weight:700;font-size:14px}
.mbar span{flex:1 1 260px}
</style>

x="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-6"/></symbol><symbol id="g-store" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/></symbol><symbol id="g-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h11v15a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1h11"/><path d="M7 3a2 2 0 0 0-2 2v12M10 8h5M10 12h5"/></symbol><symbol id="g-brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 3 3h0V4zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-3 3V4z"/></symbol><symbol id="g-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="g-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M13 10h5M13 14h5M6 16h5"/></symbol><symbol id="g-flow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6a3 3 0 0 1 3 3v6"/></symbol><symbol id="g-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/></symbol><symbol id="g-mem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2"/><path d= <script>window.IMG={"p-cover":"assets/p-cover.webp","p-prologue":"assets/p-prologue.webp","p-ch1-map":"assets/p-ch1-map.webp","p-ch2-graph":"assets/p-ch2-graph.webp","p-ch3-harness":"assets/p-ch3-harness.webp","p-ch4-create":"assets/p-ch4-create.webp","p-ch5-skills":"assets/p-ch5-skills.webp","p-ch6-publish":"assets/p-ch6-publish.webp","p-ch7-mcp":"assets/p-ch7-mcp.webp","p-ch7-a2a":"assets/p-ch7-a2a.webp","p-ch8-cowork":"assets/p-ch8-cowork.webp","p-ch8-code":"assets/p-ch8-code.webp","p-ch9-crossroads":"assets/p-ch9-crossroads.webp","p-epilogue":"assets/p-epilogue.webp","p-villains":"assets/p-villains.webp","orbi":"assets/orbi-anim.webp","sari":"assets/sari.webp","nova":"assets/nova.webp","kubo":"assets/kubo.webp","v-oni":"assets/v-oni.webp","v-vague":"assets/v-vague.webp","v-muncher":"assets/v-muncher.webp"};window.COMIC={"chapters":[{"id":"c0","num":"Prologue","title":"Welcome to Contoso","dur":"5 min","goal":"Meet the team, the mission and the three anti-pattern villains.","pages":[{"type":"scene","img":"p-prologue","kb":"kb-a","caption":"Contoso, Modern Work team. Dewi's first morning as an engineer.","bubbles":[{"who":"nova","t":"Welcome aboard, Dewi! Your laptop is ready, and so is your first mission: it's on that wall.","x":30,"y":2,"w":26,"tail":"b92"},{"who":"sari","t":"A robot outline... with no robot inside?","x":2,"y":2,"w":24,"tail":"b85"},{"who":"nova","t":"That's Onboarding Buddy, an agent that helps every new hire. You'll build it, one step at a time.","x":72,"y":60,"w":27,"tail":"t15"}],"fx":["sparkle"],"src":["ab-overview","cs-quickstart-nl"]},{"type":"card","title":"Mission brief: Onboarding Buddy","kicker":"The scenario","aside":{"img":"orbi","say":"That's me, once Dewi builds me!"},"body":"\n<p><b>Goal.<\/b> Help Contoso new hires find answers (HR policies, first-week checklist, IT setup) and get routine requests done.<\/p>\n<ul>\n<li><b>v1, Onboarding Buddy:<\/b> a declarative agent in Microsoft 365 Copilot, built with <b>Agent Builder<\/b>, grounded in approved HR content.<\/li>\n<li><b>v2, Onboarding Orchestrator:<\/b> a <b>Copilot Studio<\/b> agent that adds tools (MCP), a connected IT agent (A2A), skills and wider publishing.<\/li>\n<\/ul>\n<p><b>Why this scenario?<\/b> Microsoft Learn uses it too. The Agent Builder overview lists <i>a team onboarding agent<\/i> as a good fit. The Agent Builder vs Copilot Studio comparison gives <i>an onboarding or project-information agent grounded in approved organizational content<\/i> as its Agent Builder example. The Copilot Studio natural-language quickstart automates employee onboarding.<\/p>\n<p class=\"note\">Ground rule for this comic: technical statements come from the Microsoft Learn articles listed under <b>Sources<\/b> on each page (retrieved 15 Nov 2026). Preview features are labelled and can change.<\/p>","src":["ab-overview","ab-vs-cs","cs-quickstart-nl"]},{"type":"scene","img":"p-villains","kb":"kb-c","caption":"Every story needs villains. These three are anti-patterns that Microsoft Learn warns about. Watch for them later.","bubbles":[{"who":"oni","t":"Share every folder with everyone! Copilot will happily find it all!","x":2,"y":80,"w":30,"tail":"t50"},{"who":"vague","t":"Name it 'Tool1'. Description: 'does stuff'.","x":36,"y":82,"w":26,"tail":"t50"},{"who":"muncher","t":"Run the biggest engine for every tiny question. Yum, credits!","x":62,"y":2,"w":27,"tail":"b70"}],"fx":["sparkle"],"src":["m365-overview","cs-tools","cs-choose-harness"]}]},{"id":"c1","num":"Chapter 1","title":"The big picture: MCP, A2A, Microsoft 365 Copilot and Copilot Studio","short":"The big picture","dur":"20 min","goal":"Place two products and two open protocols on one map before building anything.","pages":[{"type":"scene","img":"p-ch1-map","kb":"kb-b","caption":"Nova projects the map of the Modern Work agent stack.","bubbles":[{"who":"nova","t":"Four islands. Two are products you use and build with. Two are open protocols that connect things.","x":56,"y":2,"w":28,"tail":"l60"},{"who":"orbi","t":"Ooh, islands!","x":25,"y":1,"w":14,"tail":"b20"},{"who":"sari","t":"Copilot, Copilot Studio, MCP, A2A... rivals?","x":60,"y":19,"w":30,"tail":"l70"},{"who":"nova","t":"Teammates. Learn their jobs first, then pick the right one for each job.","x":60,"y":33,"w":30,"tail":"l30"}],"fx":["sparkle","glow:46,55","glow:62,46","glow:36,72","glow:62,74"],"src":["m365-overview","cs-overview","win-mcp","cs-a2a-std"]},{"type":"card","title":"Two products","kicker":"Use and build","aside":{"img":"nova","say":"Note the new names: the Microsoft 365 Copilot app is now called Microsoft Copilot."},"body":"\n<h4>Microsoft 365 Copilot<\/h4>\n<ul>\n<li>The AI assistant in Microsoft 365. Learn notes that <b>the Microsoft 365 Copilot app is now called Microsoft Copilot<\/b> (primary URL copilot.cloud.microsoft).<\/li>\n<li>Every Copilot experience combines large language models, grounding in web and/or organizational data (<b>Microsoft Graph and Work IQ<\/b>), and <b>access scoped by the user's permissions<\/b>.<\/li>\n<li>Extend it with agents, for example <b>declarative agents<\/b> built in <b>Agent Builder<\/b>.<\/li>\n<\/ul>\n<h4>Copilot Studio<\/h4>\n<ul>\n<li>A graphical, <b>low-code studio<\/b> for building and managing agents, workflows and agent flows. You connect them to data and systems and publish them where users work (Teams, Microsoft Copilot, websites, mobile apps and other channels).<\/li>\n<li>Whatever you build runs on a <b>harness<\/b> (Chapter 3).<\/li>\n<\/ul>","src":["m365-overview","cs-overview","agents-compare"]},{"type":"card","title":"Two open protocols","kicker":"Connect","aside":{"img":"kubo","say":"I speak A2A. Send me tasks, not just API calls!"},"body":"\n<h4>MCP: Model Context Protocol<\/h4>\n<ul>\n<li>An open protocol that standardizes how AI apps connect to external tools and data sources.<\/li>\n<li>An MCP server can publish <b>tools<\/b> (functions a model can call), <b>resources<\/b> (file-like data) and <b>prompts<\/b> (templates). The standard-harness article says Copilot Studio currently supports <b>tools and resources<\/b>.<\/li>\n<li>Transport: Copilot Studio supports the <b>Streamable<\/b> transport. SSE support ended after August 2025.<\/li>\n<\/ul>\n<h4>A2A: Agent2Agent protocol<\/h4>\n<ul>\n<li>An open standard for communication and collaboration <b>between agents<\/b>.<\/li>\n<li>An orchestrator can send tasks to external agents with structured metadata and get responses in a predictable format. In Learn's words, Copilot Studio can <i>delegate tasks to another agent, not just call APIs<\/i>.<\/li>\n<li>Remote agents describe themselves in an <b>agent card<\/b>, which Copilot Studio reads to discover them.<\/li>\n<\/ul>","src":["win-mcp","cs-mcp-std","cs-mcp-existing","cs-a2a-std","cs-a2a"]},{"type":"table","title":"Which integration for which need? (Learn's guidance for Copilot Studio)","headers":["Integration need","Recommended approach"],"rows":[["Connect to APIs or basic HTTP services","Custom connectors / HTTP tools"],["Use MCP tools or resources","MCP servers"],["Integrate agents built with the Microsoft 365 Agents SDK","Activity Protocol"],["Integrate agents that already implement A2A (external frameworks, hosted outside Copilot Studio, own reasoning)","A2A connection"]],"extra":{"headers":["","A2A protocol","HTTP connector"],"rows":[["Designed for agent workflows","Yes","No"],["Supports multiturn interactions","Yes","No"],["Rich contextual metadata","Yes","Limited"],["Interoperable across frameworks","Yes","Varies"]]},"note":"You can combine several integration models in the same Copilot Studio agent.","src":["cs-a2a-std"]},{"type":"diagram","svg":"a1","title":"Architecture: the big picture","caption":"People use agents in Microsoft Copilot and Teams. Declarative agents run on Copilot's orchestrator and models. Copilot Studio agents run on a harness and reach tools over MCP and other agents over A2A. Admins govern from the Microsoft 365 admin center and the Power Platform admin center.","src":["agents-compare","cs-harnesses","cs-teams","mcp-m365","cs-connected","agent365","workiq"]},{"type":"card","title":"Where Work IQ fits","kicker":"Context for agents","aside":{"img":"orbi","say":"Same protocols again: A2A, MCP and REST!"},"body":"\n<ul>\n<li><b>Work IQ<\/b> is a workplace intelligence layer that lets agents reason over organizational and business data, context and tools. It is permission-aware: every request runs as a specific user.<\/li>\n<li>Its API endpoints include <b>A2A<\/b>, a <b>remote MCP server<\/b> and a <b>REST API<\/b>, the same protocols from this chapter.<\/li>\n<li>The Work IQ MCP collapses hundreds of operations into <b>10 generic tools<\/b> (verbs such as fetch, create and update) over mail, calendar, files, people, chat and sites.<\/li>\n<li>Billing: Work IQ API usage is usage-based (Copilot Credits) and <b>independent of Microsoft 365 Copilot licensing<\/b>. For licensed users, Work IQ is available in Microsoft 365 Copilot experiences and agents.<\/li>\n<\/ul>","src":["workiq","m365-overview"]},{"type":"quiz","title":"Checkpoint 1","qs":[{"q":"Your Copilot Studio agent must hand a whole task to an agent built on another framework that already implements the Agent2Agent protocol. What do you use?","opts":["An A2A connection","A custom connector to its REST API","An MCP resource","A Copilot connector"],"a":0,"why":"Learn recommends A2A for agents that already implement the protocol: it delegates tasks, not just API calls.","src":"cs-a2a-std"},{"q":"Which MCP capability types does Copilot Studio currently support, according to the standard-harness MCP article?","opts":["Prompts only","Tools and resources","Tools, resources and prompts","Resources only"],"a":1,"why":"The article lists resources, tools and prompts, then notes that Copilot Studio currently supports tools and resources.","src":"cs-mcp-std"},{"q":"What limits the organizational data Microsoft 365 Copilot can use in a response?","opts":["The model's training data","The tenant's storage quota","The signed-in user's permissions","The admin's mailbox"],"a":2,"why":"Data access is always scoped to the signed-in user's permissions.","src":"m365-arch"}]}]},{"id":"c2","num":"Chapter 2","title":"Microsoft 365 Copilot deep dive","short":"Microsoft 365 Copilot","dur":"25 min","goal":"Explain the prompt flow, the security model, the license tiers and the two agent types.","pages":[{"type":"scene","img":"p-ch2-graph","kb":"kb-a","caption":"Dewi tries Microsoft Copilot for the first time.","bubbles":[{"who":"sari","t":"Copilot, what's on my first-week checklist?","x":1,"y":1,"w":20,"tail":"b70"},{"who":"nova","t":"Copilot grounds your prompt with Microsoft Graph, using only content you're already allowed to open.","x":1,"y":14,"w":22,"tail":"r35"},{"who":"orbi","t":"Locked nodes stay locked. For you, they're simply not there!","x":74,"y":29,"w":25,"tail":"t70"}],"fx":["sparkle","glow:70,27"],"src":["m365-arch"]},{"type":"diagram","svg":"a2","title":"Architecture: how a Copilot prompt flows","caption":"(1) A user enters a prompt in a Microsoft 365 app. (2) Copilot pre-processes it with grounding and (3) reads Microsoft Graph in the user's tenant, only what that user can access. (4) The grounded prompt goes to the LLM. (5) The response returns to the app.","src":["m365-arch","m365-privacy"]},{"type":"card","title":"Security facts you can quote","kicker":"Learn says","aside":{"img":"nova","say":"Quote these to security teams, then link the source."},"body":"\n<ul>\n<li>Copilot works <b>inside the Microsoft 365 service boundary<\/b>, but that doesn't give it tenant-wide visibility. Access is always <b>scoped to the signed-in user's permissions<\/b>.<\/li>\n<li><b>Prompts, responses and data accessed through Microsoft Graph aren't used to train foundation LLMs<\/b>, including those used by Microsoft Copilot.<\/li>\n<li>Data used to generate responses is <b>encrypted in transit<\/b>. Copilot honors <b>Conditional Access<\/b> and <b>MFA<\/b>.<\/li>\n<li>Interactions are stored in the user's Copilot chat history. Admins can search them and set retention with <b>Microsoft Purview<\/b>.<\/li>\n<li>For EU users, traffic stays within the <b>EU Data Boundary<\/b>.<\/li>\n<\/ul>","src":["m365-arch","m365-privacy","m365-overview"]},{"type":"table","title":"Which Copilot experience does a user have?","headers":["","Copilot Chat (Basic)","Microsoft 365 Copilot (Basic)","Microsoft 365 Copilot (Premium)","Usage-based billing capabilities"],"rows":[["Grounding","Web. Org content only if you upload it, use open content (Outlook, Teams) or use a pay-as-you-go agent","Same as Copilot Chat (Basic)","Web + work data, automatically through Microsoft Graph and Work IQ","Web + work data through Microsoft Graph and Work IQ"],["Copilot in Word, Excel, PowerPoint, OneNote","Not included","Standard access","Priority access, full experience","Full experience"],["Agents","Agents that use web data; pay-as-you-go work-data agents","Agents that use web data; pay-as-you-go work-data agents","Includes agents that use web and work data","Includes Copilot Cowork, Copilot Code and agents (billed by usage)"]],"note":"Learn: to use usage-based billing capabilities (Cowork, and Copilot Code in Frontier) you must have a Microsoft 365 Copilot (Premium) license. Check the official licensing pages before quoting entitlements or prices.","src":["m365-overview"]},{"type":"diagram","svg":"a3","title":"Architecture: two ways to build agents for Microsoft 365 Copilot","caption":"Declarative agents add instructions, knowledge and actions on top of Copilot's own orchestrator and models. Custom engine agents bring their own orchestrator and models, need their own hosting, and you own their compliance and responsible-AI practices.","src":["agents-compare","da-overview"]},{"type":"table","title":"Declarative vs custom engine agents (per Learn)","headers":["","Declarative agent","Custom engine agent"],"rows":[["Orchestrator and model","Copilot's orchestrator and foundation models","Your own orchestrator and models"],["Hosting","No extra hosting needed","Extra hosting outside Microsoft 365, typically cloud services such as Azure, at extra cost"],["Tooling","Agent Builder (low-code); Visual Studio / VS Code with Microsoft 365 Agents Toolkit (pro-code)","Copilot Studio (low-code) or pro-code: Visual Studio, VS Code, Agents Toolkit (.NET, Python, JavaScript)"],["Proactive behaviour","Not supported; user-initiated","Can trigger actions without direct user input"],["Compliance, security, RAI","Inherits Microsoft 365 standards","You must ensure your own"]],"src":["agents-compare"]},{"type":"card","title":"Model choice and response modes","kicker":"Learn says","aside":{"img":"orbi","say":"Auto is the default. Users can still switch."},"body":"\n<ul>\n<li>Copilot's model selector offers <b>Auto<\/b> (Copilot decides, using a real-time router), <b>Quick response<\/b> (speed, concise answers) and <b>Think deeper<\/b> (a reasoning model for complex questions). Options update as new models arrive.<\/li>\n<li>In Agent Builder you can set an agent's <b>default response mode<\/b> (Auto is the default). Users can override it with the model selector.<\/li>\n<li>Learn notes that Anthropic subprocessors are available only in applicable licensed experiences and aren't available to all users by default.<\/li>\n<\/ul>","src":["m365-overview","ab-build"]},{"type":"villain","v":"oni","title":"Villain alert: Oversharing Oni","attack":"If a site is shared too widely, Copilot can surface its content to people who technically have access.","counter":["Fix permissions at the source: Copilot only surfaces organizational data that the individual user can at least view.","Use SharePoint Advanced Management to reduce oversharing and clean up inactive sites, and Restricted content discovery to limit discovery from specific sites while you review them.","Use Microsoft Purview to classify and label data, help prevent leakage, and review Copilot prompts and responses.","In agents: when you upload files as knowledge to an Agent Builder agent, anyone who has access to the agent also has access to the information in those files."],"src":["m365-privacy","m365-overview","ab-knowledge"]},{"type":"quiz","title":"Checkpoint 2","qs":[{"q":"In the prompt flow, what happens before the LLM generates a response?","opts":["The prompt is used to retrain the model","Copilot grounds the prompt by using Microsoft Graph in the user's tenant","Nothing: the raw prompt goes straight to the model","The prompt is copied to every mailbox"],"a":1,"why":"Copilot pre-processes the prompt with grounding and Microsoft Graph, then sends the grounded prompt to the LLM.","src":"m365-arch"},{"q":"Are prompts, responses and data accessed through Microsoft Graph used to train foundation LLMs?","opts":["Yes, always","Only with a Premium license","No","Only after 30 days"],"a":2,"why":"Learn states that they aren't used to train foundation LLMs, including those used by Microsoft Copilot.","src":"m365-privacy"},{"q":"Which agent type uses Copilot's own orchestrator and models with no extra hosting?","opts":["Declarative agent","Custom engine agent","Both","Neither"],"a":0,"why":"Declarative agents use Copilot's orchestrator and foundation models, so no extra hosting is needed.","src":"agents-compare"}]}]},{"id":"c3","num":"Chapter 3","title":"Copilot Studio and its harnesses, including the 'GitHub Copilot harness'","short":"Copilot Studio and harnesses","dur":"30 min","goal":"Understand what a harness is, compare the three harnesses, and use GitHub Copilot as a coding harness for agents.","pages":[{"type":"scene","img":"p-ch3-harness","kb":"kb-b","caption":"The harness hangar. Same models, different engines.","bubbles":[{"who":"nova","t":"Everything you build in Copilot Studio runs on a harness: the runtime between your design and the model.","x":2,"y":2,"w":29,"tail":"b88"},{"who":"sari","t":"Three engines. Which one for Onboarding Buddy v2?","x":1,"y":16,"w":19,"tail":"b65"},{"who":"orbi","t":"The violet one has a sandbox and skills!","x":30,"y":72,"w":24,"tail":"t40"}],"fx":["sparkle","glow:52,30","glow:12,30","glow:85,35"],"src":["cs-harnesses"]},{"type":"card","title":"What is a harness?","kicker":"Learn says","aside":{"img":"nova","say":"The model brings the reasoning. The harness equips and directs it."},"body":"\n<ul>\n<li>A harness is the runtime between your agent's design and the model. It decides <b>when to call the model<\/b>, <b>which components to send<\/b>, <b>how to interpret the result<\/b>, and <b>which tools to call<\/b>.<\/li>\n<li>The harness you choose affects:\n <ul><li>how the work gets done (follow defined rules and steps, or take a goal and plan),<\/li>\n <li>how much can be automated end to end,<\/li>\n <li>which experiences you get out of the box (files, skills, memory, tool orchestration),<\/li>\n <li>how usage is billed.<\/li><\/ul><\/li>\n<li>Copilot Studio offers three: the <b>Microsoft Copilot harness<\/b>, the <b>Customer Conversation harness<\/b> and the <b>standard harness<\/b>.<\/li>\n<\/ul>","src":["cs-harnesses","cs-choose-harness","cs-overview"]},{"type":"table","title":"The three harnesses (from 'Harnesses in Copilot Studio')","headers":["","Microsoft Copilot harness","Customer Conversation harness","Standard harness"],"rows":[["Best for","Complex, multi-step business processes","Customer-facing, contact-center-style scenarios over voice and chat","Rule-based agents and structured conversations"],["How it works","Reasons through a goal step by step","Multi-agent architecture that can escalate to a human","Follows the topics and rules you define"],["Recovers from problems","Retries and finds alternative paths","Escalates through a defined path","Follows the paths you built"],["Works with files","Creates, edits and reasons over Word, Excel, PowerPoint, PDF","Not a focus","Not a focus"],["Skills and memory","Yes","Yes","Not a focus"],["Publishing","Internal teams or external customers","Website chat or a phone number","Internal teams or external customers"],["Billing","Copilot Credits (usage-based)","Copilot Credits (usage-based)","Standard-harness licensing model"]],"note":"The Microsoft Copilot harness runs each task in a secure sandbox governed by Copilot Studio. Learn's example fit is an accounts payable process.","src":["cs-harnesses"]},{"type":"card","title":"Name check: 'GitHub Copilot harness'","kicker":"Read the dates","aside":{"img":"orbi","say":"Same engine, two names in the docs. Check the date!"},"body":"\n<ul>\n<li>Learn's newest Copilot Studio articles (updated 12 Nov 2026) call the new agent experience the <b>Microsoft Copilot harness<\/b>.<\/li>\n<li>Several articles in the same <i>agents experience<\/i> doc set, last updated in October 2026 (knowledge, skills, channels, usage-based billing), still say <b>GitHub Copilot harness<\/b> for the same Build-tab experience. The harness feature table also marks skills and memory as <i>\"GH agents only\"<\/i>.<\/li>\n<li><b>Practical rule:<\/b> treat the two names as the same harness, and check an article's date and current wording before you present.<\/li>\n<li><b>Different topic, same words:<\/b> GitHub Copilot can also be your <i>coding<\/i> harness for Copilot Studio agents, through the VS Code extension (two pages ahead).<\/li>\n<\/ul>","src":["cs-harness-overview","cs-knowledge","cs-skills-overview","cs-billing","cs-channels","cs-vscode"]},{"type":"table","title":"Standard vs Microsoft Copilot harness: feature differences to know","headers":["Feature","Standard harness","Microsoft Copilot harness"],"rows":[["Connectors, MCP, workflows as tools","Supported","Supported"],["Prompt tool","Supported","Not supported (replaced by Skills)"],["Computer use","Supported","Planned"],["Knowledge: websites, files, SharePoint, Graph connectors, Dataverse","Supported","Supported"],["Knowledge: Azure AI Search","Supported","Not supported"],["Skills / Memory","Not supported","Supported"],["Code interpreter","Supported (opt-in)","Supported (native)"],["Topics and system triggers","Supported","Replaced by Hooks"],["Connected agents: Copilot Studio, Foundry, A2A, Microsoft 365 Agents SDK","Supported","Supported"],["Channels: Microsoft 365 / Teams, website","Supported","Supported"],["Channels: SharePoint, WhatsApp, Dynamics 365 Contact Center","Supported","Not supported"],["Manual / custom authentication","Supported","Not supported"],["Custom entities","Supported","Not supported"],["ALM, data policies (DLP), evaluation, monitor","Supported","Supported"]],"note":"Source: the comparison table in 'About agents powered by the Microsoft Copilot harness' (12 Nov 2026). Re-check before production: preview features move fast.","src":["cs-harness-overview"]},{"type":"card","title":"Standard or Microsoft Copilot harness?","kicker":"Choose by scenario","aside":{"img":"nova","say":"Neither is universally better. It depends on the business process."},"body":"\n<div class=\"two\">\n<div><h4>Standard harness<\/h4><ul>\n<li>Short, bounded work with a stable set of actions<\/li>\n<li>Explicit control and predictable, consistent answers<\/li>\n<li>Responsive, high-traffic conversations; established channels and features<\/li>\n<li>Learn's example: <i>HR intake and routing bot<\/i><\/li><\/ul><\/div>\n<div><h4>Microsoft Copilot harness<\/h4><ul>\n<li>Long-running, coordination-heavy, reasoning-intensive work<\/li>\n<li>Large files and data; creates and edits documents<\/li>\n<li>Agentic loops, persistent memory, shared context with subagents<\/li>\n<li>Learn's examples: <i>accounts payable reconciliation<\/i>, <i>customer meeting preparation<\/i><\/li><\/ul><\/div>\n<\/div>\n<ul>\n<li>Migrate only for a <b>scenario-level benefit<\/b>, and treat it as re-architecture, not component conversion.<\/li>\n<li>Upgrade to the Microsoft Copilot harness (preview) creates a <b>copy<\/b> and carries over instructions, tools and suggested prompts. It doesn't migrate knowledge sources, Power Fx expressions or child agents.<\/li>\n<li>A combined pattern is valid: a Microsoft Copilot harness agent curates data on a schedule while standard agents serve high-volume users.<\/li>\n<\/ul>","src":["cs-choose-harness","cs-upgrade"]},{"type":"diagram","svg":"a4","title":"Architecture: inside an agent on the Microsoft Copilot harness","caption":"You configure instructions, knowledge, tools, skills, model, connected agents and memory on the Build tab. Then you test in Preview, measure in Evaluate, publish to channels and watch Monitor. Hooks run workflows at lifecycle events. The runtime plans, calls tools and works with files in a sandbox.","src":["cs-harness-overview","cs-choose-harness","cs-hooks","cs-channels","cs-billing"]},{"type":"card","title":"GitHub Copilot as your coding harness","kicker":"Agents as code","aside":{"img":"sari","say":"So I can review agent changes in a pull request?"},"body":"\n<ul>\n<li>The <b>Microsoft Copilot Studio extension for VS Code<\/b> (generally available) lets you <b>clone<\/b> an agent to your machine, edit its <b>YAML agent definition<\/b>, <b>apply<\/b> changes to an environment to preview and test, then deploy.<\/li>\n<li>Learn names <b>GitHub Copilot<\/b> and Claude Code as examples of <i>agent harnesses<\/i> you can use to edit those definitions, as an alternative to the web UI.<\/li>\n<li>Use <b>Git<\/b> and <b>pull requests<\/b> for review and history: standard development practices for agents.<\/li>\n<li><b>Boundary:<\/b> GitHub Copilot assists implementation. It doesn't own the Microsoft 365 package, validation, publishing or runtime.<\/li>\n<li>The VS Code extension article is tagged for the <b>standard harness<\/b>.<\/li>\n<\/ul>","src":["cs-vscode","dev-tools"]},{"type":"villain","v":"muncher","title":"Villain alert: Credit Muncher","attack":"Put every tiny FAQ on the biggest harness. More reasoning means more crunchy credits!","counter":["Learn warns that, without optimization, a more capable harness can overwork a simple problem: more Copilot Credits and latency without a better outcome.","On the Microsoft Copilot harness, billing starts when you start building: building, previewing, testing and evaluations consume credits. On the standard harness, billing starts after publishing.","Credits cover LLM tokens, tools (including knowledge and MCP) and the harness itself.","Watch consumption on the agent's Monitor page, and across environments under Licensing > Copilot Studio in the Power Platform admin center."],"src":["cs-choose-harness","cs-billing"]},{"type":"quiz","title":"Checkpoint 3","qs":[{"q":"Which harness is built for customer-facing voice and chat, with escalation to a human representative?","opts":["Standard harness","Customer Conversation harness","Microsoft Copilot harness","GitHub Copilot CLI"],"a":1,"why":"The Customer Conversation harness uses a multi-agent architecture with escalation paths to human representatives.","src":"cs-harnesses"},{"q":"In the Microsoft Copilot harness, what replaces topics and system triggers?","opts":["Custom entities","Power Fx","Hooks","Child agents"],"a":2,"why":"The feature table says topics are replaced by Hooks, which run workflows at points in the agent's lifecycle.","src":"cs-harness-overview"},{"q":"When does Copilot Credit billing start for an agent on the Microsoft Copilot harness?","opts":["Only after publishing","From the moment you start building, testing and evaluating","Only for external users","Never"],"a":1,"why":"Unlike the standard harness, which bills after publish, this harness charges from the moment you start building.","src":"cs-billing"}]}]},{"id":"c4","num":"Chapter 4","title":"Create the agent: Agent Builder and Copilot Studio","short":"Create an agent","dur":"30 min","goal":"Build Onboarding Buddy twice, add knowledge, and test before anyone else sees it.","pages":[{"type":"scene","img":"p-ch4-create","kb":"kb-a","caption":"Build time. One agent, two workshops.","bubbles":[{"who":"sari","t":"Path A: Agent Builder in Microsoft Copilot. Path B: Copilot Studio. Same agent, built twice.","x":1,"y":74,"w":29,"tail":"t40"},{"who":"orbi","t":"Booting... instructions loaded... knowledge? Not yet!","x":62,"y":80,"w":30,"tail":"t10"}],"fx":["sparkle","glow:52,42","pulse:52,42"],"src":["ab-build","cs-build-new-agent"]},{"type":"steps","title":"Create the agent, step by step","cols":[{"head":"Path A: Agent Builder (Microsoft 365 Copilot)","steps":["In Copilot chat, select <b>Agents &amp; Skills<\/b> &gt; <b>New agent<\/b>.","<b>Describe<\/b> the agent in natural language (recommended): Agent Builder fills in the name, description, instructions, knowledge and suggested prompts. Or select <b>Skip to configure<\/b>, or start from a <b>template<\/b>.","On <b>Configure<\/b>: Name (up to 30 characters), Description (up to 1,000), Instructions (up to 8,000), Knowledge, Starter prompts, Icon (PNG, 192 x 192, up to 1 MB).","Model: default response mode <b>Auto<\/b>, <b>Quick response<\/b> or <b>Think deeper<\/b>. Capabilities: <b>Create documents, charts, and code<\/b> (code interpreter) and <b>Create images<\/b>.","Test on the <b>Try it<\/b> tab (enabled once name, description and instructions exist), then select <b>Create<\/b>."]},{"head":"Path B: Copilot Studio (Microsoft Copilot harness)","steps":["Sign in to Copilot Studio. On <b>Home<\/b>, select the <b>Agent<\/b> tile (or <b>Agents<\/b> &gt; <b>New agent<\/b>).","The agent designer opens on the <b>Build<\/b> tab with the name field in focus. Optionally set language, solution and schema name in <b>Agent settings<\/b>. The schema name becomes read-only after the first save.","In <b>Instructions<\/b>, describe the role, tone and rules.","Select <b>Save<\/b>, then add knowledge, tools, skills, connected agents, the model and memory.","Alternative (preview): describe the business goal on Home and let Copilot Studio build agents and workflows with you."]}],"src":["ab-build","ab-skills","cs-build-new-agent","cs-quickstart-nl"]},{"type":"card","title":"For comparison: the standard-harness path","kicker":"Copilot Studio classic flow","aside":{"img":"nova","say":"Same studio, different harness, different screens."},"body":"\n<ul>\n<li>On Home, turn off <b>New experience<\/b> to get the standard-harness Home page. Describe the agent in your own words (up to 1,024 characters).<\/li>\n<li>AI generates the name, description and instructions, and suggests triggers, channels, knowledge and tools. Suggestions don't persist beyond the session.<\/li>\n<li>Work on the <b>Overview<\/b> page: add knowledge in the Knowledge section, then test in the <b>Test your agent<\/b> chat.<\/li>\n<li>Edit the introductory message through the <b>Conversation Start<\/b> topic. Add up to <b>10 suggested prompts<\/b> for Teams and Microsoft Copilot.<\/li>\n<li>Icon: PNG, under 72 KB, up to 192 x 192 pixels.<\/li>\n<li>A trial license lets you build and test, but not publish.<\/li>\n<\/ul>","src":["cs-quickstart-std"]},{"type":"table","title":"Adding knowledge: what each tool supports","headers":["","Agent Builder (declarative agent)","Copilot Studio (Microsoft Copilot harness)"],"rows":[["Public websites","Up to 4 URLs; max two levels deep; no query parameters. Optional 'Search all websites'","Public websites (Featured)"],["SharePoint / OneDrive","SharePoint: up to 100 files and 1 list. OneDrive: up to 50 files. Permissions and sensitivity labels respected","SharePoint and OneDrive for Business (Featured). The dialog warns when you select more items than the admin limit, for example 5 at once"],["Files you upload","Up to 20 embedded files (for example .docx, .pdf and .pptx up to 512 MB; .xlsx up to 30 MB)","Drag-and-drop upload area, always available"],["Microsoft 365 work data","Teams chats and meetings (5 + 5), Outlook email (whole mailbox, can't be scoped), People data","Not in the Add knowledge list. For agents copied from Agent Builder, Learn uses Power Platform connectors for Teams and Outlook; Microsoft 365 MCP servers (for example Mail) can be added as tools"],["Other systems","Copilot connectors (admin-enabled, some can be scoped); Dynamics 365 and Power Apps data through Business Applications in Work IQ","Salesforce, ServiceNow, Azure SQL (Featured); Advanced: Azure DevOps Wiki, Azure DevOps Work Items, Custom Connector, Enterprise websites. Graph connectors and Dataverse tables are supported (harness feature table)"],["General knowledge","'Only use specified sources' prioritizes your sources but doesn't block general AI knowledge","No general-knowledge switch: you control access through the sources you add"],["Admin control","Microsoft 365 agent controls; the 'Allow web search in Copilot' policy takes precedence","The 'Knowledge sources for agents' setting in the Power Platform admin center can block source types"]],"note":"For stricter control over knowledge than Agent Builder offers, Learn points to Copilot Studio.","src":["ab-knowledge","ab-overview","cs-knowledge","cs-harness-overview","ab-copy","cs-mcp-tool"]},{"type":"diagram","svg":"a5","title":"Architecture: knowledge grounding paths","caption":"Agent Builder agents ground in Microsoft 365 content and connectors with the user's own permissions. Copilot Studio agents add knowledge from files, Microsoft 365 and line-of-business systems, which admins can allow or block per environment.","src":["ab-knowledge","cs-knowledge","m365-arch"]},{"type":"card","title":"Test before anyone else sees it","kicker":"Try it vs Preview","aside":{"img":"orbi","say":"Thumbs up if I cited the right file!"},"body":"\n<div class=\"two\">\n<div><h4>Agent Builder: Try it<\/h4><ul>\n<li>Behaves like the real agent: same instructions, same knowledge.<\/li>\n<li>New SharePoint or OneDrive files may show <b>Preparing<\/b>. You can test, but those files aren't used until they're ready.<\/li>\n<li>Not available in Try it: sharing prompts, giving feedback and @mentioning other agents. These work after you create the agent.<\/li>\n<\/ul><\/div>\n<div><h4>Copilot Studio: Preview tab<\/h4><ul>\n<li>Toggle <b>End user preview<\/b> to switch between the maker view and the end-user view.<\/li>\n<li>The maker view shows a <b>reasoning card<\/b>. The <b>activity trace<\/b> shows which tool ran and what it returned.<\/li>\n<li>Edits on the Build tab apply from the <b>next turn<\/b>. <b>New chat<\/b> resets the context.<\/li>\n<li>Use <b>Evaluate<\/b> for repeatable test sets.<\/li>\n<\/ul><\/div>\n<\/div>","src":["ab-build","ab-knowledge","cs-test","cs-harness-overview"]},{"type":"villain","v":"vague","title":"Villain alert: Vague-o","attack":"Name: 'Agent1'. Description: 'Helps.' Tool: 'DoThing'. Good luck, orchestrator!","counter":["Agent Builder: the description helps the LLM identify and use your agent, so keep it short, precise and simple.","Copilot Studio: the orchestrator picks tools by name and description. Well-described tools are invoked more accurately.","Give connected agents clear, specific descriptions that don't overlap.","Too many similar choices hurt selection. Learn's rule of thumb: performance can degrade above 30-40 tools, topics and agents, so consider splitting."],"src":["ab-build","cs-tools","cs-a2a","cs-add-other-agents"]},{"type":"cta","title":"Practice it: click-through demos","body":"Walk through <b>adding knowledge, creating, using and publishing<\/b> an agent in simulated Microsoft 365 Copilot and Copilot Studio screens. Each step links to the Learn article it follows.","links":[["Microsoft 365 Copilot (Agent Builder) demo","demo.html#m365"],["Copilot Studio demo","demo.html#studio"]]},{"type":"quiz","title":"Checkpoint 4","qs":[{"q":"What's the character limit for an Agent Builder agent's instructions?","opts":["1,000","8,000","30","20,000"],"a":1,"why":"Name: 30, description: 1,000, instructions: 8,000 characters.","src":"ab-build"},{"q":"What does 'Only use specified sources' do in Agent Builder?","opts":["Blocks all general AI knowledge","Prioritizes your sources without blocking general knowledge","Deletes other knowledge sources","Shares your sources with everyone"],"a":1,"why":"Learn says it prioritizes your sources. Agent Builder doesn't support blocking general AI knowledge.","src":"ab-knowledge"},{"q":"Where do you test a Microsoft Copilot harness agent before publishing?","opts":["Monitor tab","Teams admin center","Preview tab","Agent Store"],"a":2,"why":"The Preview tab is for interactive testing before you publish.","src":"cs-test"}]}]},{"id":"c5","num":"Chapter 5","title":"Create a skill","short":"Create a skill","dur":"25 min","goal":"Package one repeatable job as a skill and know where skills live: Agent Builder, Copilot Studio and Cowork.","pages":[{"type":"scene","img":"p-ch5-skills","kb":"kb-b","caption":"The skill library. Dewi writes her first SKILL.md.","bubbles":[{"who":"nova","t":"Instructions say who the agent is. A skill teaches one job, done the same way every time.","x":50,"y":1,"w":25,"tail":"r50"},{"who":"sari","t":"So I package the welcome-pack steps once and reuse them?","x":1,"y":1,"w":24,"tail":"b80"},{"who":"orbi","t":"And I only load it when someone needs it. Progressive disclosure!","x":36,"y":84,"w":27,"tail":"t70"}],"fx":["sparkle","glow:57,30"],"src":["cs-skills-overview","da-skills"]},{"type":"card","title":"What is a skill?","kicker":"Learn says","aside":{"img":"nova","say":"The description is the trigger. Write it like a search query."},"body":"\n<ul>\n<li>A <b>portable package of instructions<\/b>, plus optional scripts and resources, that gives an agent a specialized capability. Skills follow an <b>open specification<\/b>.<\/li>\n<li>The core file is <b>SKILL.md<\/b>: YAML front matter with a <b>name<\/b> and a <b>description<\/b>, then Markdown instructions.<\/li>\n<li>The orchestrator activates a skill when the user's request <b>matches the skill's description<\/b>, so the description works as the trigger.<\/li>\n<li><b>Skills vs tools:<\/b> tools connect to external services. Skills are self-contained know-how that can tell the agent how to use a tool.<\/li>\n<li><b>Progressive disclosure:<\/b> the agent loads only the context it needs, when it needs it, so its context stays focused as the skill library grows.<\/li>\n<\/ul>","src":["cs-skills-overview","da-skills","cs-skills-create"]},{"type":"code","title":"Contoso example: SKILL.md","lang":"markdown","code":"---\nname: new-hire-welcome-pack\ndescription: >\n  Builds a first-week welcome pack for a Contoso new hire.\n  Use when someone asks to \"prepare a welcome pack\",\n  \"plan the first week\" or \"make an onboarding checklist\"\n  for a named new hire.\n---\n# New-hire welcome pack\n\n## Steps\n1. If missing, ask for the new hire's name, team, manager and start date.\n2. Find the onboarding checklist in the HR knowledge source.\n3. Group tasks into: Before day one, Week one, Month one.\n4. Mark laptop and account tasks as \"IT request\".\n5. Close with three friendly tips and the HR contact.\n\n## Output format\n| When | Task | Owner | Done? |\n|------|------|-------|-------|\n\n## Rules\n- Use Contoso sources only and cite them.\n- Never include salary or other personal data.","notes":["This example is ours (Contoso), written to match the format Learn describes: name and description in front matter, then numbered steps, the output format and rules.","Copilot Studio skill names use lowercase letters, numbers and hyphens, and can't start or end with a hyphen. Cowork additionally requires the name to match the skill's folder name (kebab-case).","Write instructions as Markdown with steps, response format, edge cases and the tools to use."],"src":["cs-skills-create","cowork-plugins"]},{"type":"table","title":"Where skills live","headers":["","Agent Builder (declarative agent)","Copilot Studio (Microsoft Copilot harness)","Copilot Cowork"],"rows":[["How to add","Configure &gt; Skills &gt; Add (upload the complete .zip), or ask Agent Builder in natural language","Build &gt; Skills &gt; Add skill: Generate with AI, Create from blank, or upload a file or package","Customize &gt; Skills &gt; Add (guided) or Upload skill (.md, .zip or .skill)"],["Limits","Up to 8 skills per agent; .zip up to 50 MB; instructions under 20,000 characters; 25 MB per file; 350 files","Name: lowercase letters, numbers and hyphens","Up to 50 custom skills; .md up to 1 MB; archive up to 10 MB compressed, 50 MB uncompressed, 100 files"],["Built-in skills","n/a","Document and data skills for CSV, Word, HTML, Markdown, PDF, PowerPoint and Excel","Word, Excel, PowerPoint, PDF, Email, Scheduling, Calendar Management, Meetings, Daily Briefing, Enterprise Search, Communications, Deep Research, Adaptive Cards, App (Frontier)"],["Reuse and sharing","Reuse across agents: not supported","Create once, add to multiple agents; export as Markdown files or packages","Share with specific people; Re-share sends updates"]],"note":"The Customer Conversation harness has two skill types: Generative (instruction-based) and Topic (deterministic flows).","src":["ab-skills","da-skills","cs-skills-create","cs-skills-overview","cowork-overview","cowork-customize"]},{"type":"diagram","svg":"a6","title":"Architecture: skill anatomy and progressive disclosure","caption":"Only the front matter is always loaded (about 100 tokens). The SKILL.md body loads when the skill triggers (target under 5,000 tokens). References load on demand. Scripts are executed rather than loaded into context.","src":["cowork-plugins","da-skills"]},{"type":"card","title":"Guardrails for skills","kicker":"Know the sandbox","aside":{"img":"kubo","say":"Skill scripts can't phone home. That's a feature!"},"body":"\n<ul>\n<li><b>Declarative-agent skill scripts<\/b> run in a secure sandbox with <b>no network access<\/b>, <b>no package installation<\/b> and <b>no authenticated calls<\/b>. They can use preinstalled packages.<\/li>\n<li>Connectors, API plugins and MCP servers remain available <b>through the orchestrator<\/b>, not from inside the sandbox.<\/li>\n<li>Sensitivity labels on skill files are kept and honored. Files are stored in tenant-scoped SharePoint Embedded containers.<\/li>\n<li>In tenants that use Information Barriers, admins can deploy declarative agents with skills, but users can't add skills to agents they create.<\/li>\n<li>Cowork reminds you that a skill runs as instructions to the AI: only upload skills from sources you trust.<\/li>\n<li>Don't mix up terms: <b>Azure Bot Service skills<\/b> in the standard harness are a different, code-based concept.<\/li>\n<\/ul>","src":["da-skills","ab-skills","cowork-customize","cs-publish-std"]},{"type":"quiz","title":"Checkpoint 5","qs":[{"q":"Which file is required in every skill package?","opts":["manifest.json","SKILL.md","agent.yaml","index.html"],"a":1,"why":"A skill is a directory with a required SKILL.md file plus optional resources and scripts.","src":"da-skills"},{"q":"What decides when the orchestrator activates a skill?","opts":["The skill's description matching the user's request","The file size","Alphabetical order","The user's license"],"a":0,"why":"The runtime decides based on the user's message and the skill's description.","src":"cs-skills-overview"},{"q":"Can a declarative-agent skill script call the internet from its sandbox?","opts":["Yes, any URL","Only GitHub","No: the sandbox has no network access","Only with an API key"],"a":2,"why":"Internet or network access from scripts isn't supported. The sandbox has no network access at runtime.","src":"da-skills"}]}]},{"id":"c6","num":"Chapter 6","title":"Publish the agent","short":"Publish an agent","dur":"25 min","goal":"Move from a private draft to the right audience, through sharing, channels, catalogs and approvals.","pages":[{"type":"scene","img":"p-ch6-publish","kb":"kb-c","caption":"Launch day on the roof. Lina from IT approves the org-catalog request. Nova: \"Publishing isn't one button. It's a path with gates.\"","bubbles":[{"who":"sari","t":"Go, Onboarding Buddy!","x":1,"y":2,"w":20,"tail":"b55"},{"who":"lina","t":"Approved. It's in the Agent Store under Built by your org!","x":58,"y":56,"w":22,"tail":"r10"}],"fx":["confetti","glow:49,23"],"src":["ab-catalog"]},{"type":"steps","title":"Two publishing paths","cols":[{"head":"Agent Builder: share, then org catalog","steps":["Select <b>Create<\/b>. At first the agent is private and only available to you.","<b>Share<\/b>: add people or groups as <b>Can chat<\/b> (use) or <b>Can edit<\/b> (owner). Groups can only be chat users.","Optional: turn on <b>Org-wide sharing for chat access<\/b> so the agent shows in the Agent Store for your tenant. Admins can limit who may share org-wide.","After edits, select <b>Update<\/b> to make the changes available to shared users (it can take several minutes).","For broad rollout: <b>More (...)<\/b> &gt; <b>Submit to your org catalog<\/b> (after at least one publish). Display name up to 30 characters, short description up to 80, developer name up to 32, plus website, privacy and terms URLs.","An admin reviews it in the <b>Microsoft 365 admin center<\/b>. Once approved, it appears in the Agent Store under <b>Built by your org<\/b>. Store updates need a resubmission and approval."]},{"head":"Copilot Studio (Microsoft Copilot harness)","steps":["Before publishing: the agent needs a name, description and instructions; changes saved; draft tested in Preview.","Select <b>Publish<\/b>. In the <b>Publish agent<\/b> dialog, review details and select and configure the channels.","Select <b>Publish<\/b> and watch progress. On success, choose to <b>share<\/b> the agent or <b>add it to the organization catalog<\/b>.","Each publish creates a new <b>version<\/b>. Draft changes stay in draft until you publish again.","<b>Share<\/b> icon: people and security groups (viewers can see and test, not edit), or Organization &gt; <b>End user access<\/b>.","Data policies can block channels. A policy issue on the built-in test channel alone doesn't block publishing (preview)."]}],"src":["ab-share","ab-catalog","cs-publish","cs-publish-overview","cs-share"]},{"type":"table","title":"Channels for agents on the Microsoft Copilot harness","headers":["Channel","Available?","Note"],"rows":[["Microsoft Copilot","Yes","Appears in Microsoft Copilot's agent list"],["Microsoft Teams","Yes","Chat-based interactions"],["Demo website / Web app","Yes / Yes","Demo site for testing; embed in your web app with an iframe"],["MCP client / A2A client","Preview","Expose your agent as a remote MCP server or to other agents over A2A (early-release environments only)"],["SharePoint, native app, Facebook, WhatsApp, Slack, Telegram, email","No","Not currently available on this harness"],["Genesys, LivePerson, Salesforce, ServiceNow","No","Contact-center channels not currently available on this harness"]],"note":"Standard-harness agents support more channels, including SharePoint and WhatsApp (see the feature table in Chapter 3).","src":["cs-channels","cs-harness-overview"]},{"type":"card","title":"Standard harness: Teams and Microsoft Copilot channel","kicker":"Classic path","aside":{"img":"nova","say":"Type 'start over' in Teams to see your newest version right away."},"body":"\n<ul>\n<li><b>Publish<\/b> once; every later publish updates all connected channels.<\/li>\n<li><b>Channels<\/b> &gt; <b>Teams and Microsoft Copilot<\/b>: keep <b>Make agent available in Microsoft Copilot<\/b> selected, then <b>Add channel<\/b>.<\/li>\n<li><b>See agent in Teams<\/b> installs it for you first. <b>Availability options<\/b>: Copy link; <b>Show to my teammates and shared users<\/b> (Agent Store, Shared with you); <b>Show to the organization<\/b> (admin approval, then Built for your org in the Teams app store or Built by your org in the Agent Store).<\/li>\n<li><b>Authenticate with Microsoft<\/b> is on by default. <b>No authentication<\/b> lets anyone with the link chat with the agent.<\/li>\n<li>New content appears in new sessions. In Teams, type <b>start over<\/b> to reset right away.<\/
