<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Click-through demos: add knowledge, create, use and publish an agent in Microsoft 365 Copilot (Agent Builder) and Copilot Studio. Steps follow Microsoft Learn.">
<title>Click-through demos | Agent Up, Sari!</title>
<style>:root{
  color-scheme: dark;
  --bg:#0a0f1f; --bg2:#0f1730; --panel:#131c3a; --panel2:#18234a; --ink:#eef2ff; --muted:#aab6dd; --dim:#7d89b3;
  --line:#2b3a6e; --teal:#19d3c5; --violet:#8b6cff; --blue:#4f8cff; --amber:#ffb547; --orange:#ff8a3d; --pink:#ff5fa2;
  --bubble:#ffffff; --bink:#151a2e; --cap:#fff1a8;
  --c-sari:#2f7cf6; --c-nova:#7b5cff; --c-orbi:#0fb3a6; --c-kubo:#f07a2a; --c-lina:#d9468f; --c-oni:#8e44ad; --c-vague:#6b7a8f; --c-muncher:#c0392b;
  --r:18px; --shadow:0 18px 50px rgba(0,0,0,.45);
  --font: "Segoe UI", "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Black", "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  --mono: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root{ --bg:#0a0f1f; } }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 10% -10%, rgba(139,108,255,.20), transparent 60%),
  radial-gradient(900px 500px at 110% 10%, rgba(25,211,197,.16), transparent 60%),
  radial-gradient(800px 600px at 50% 120%, rgba(79,140,255,.14), transparent 60%), var(--bg);}
a{color:var(--teal)} a:hover{color:#7ff3ea}
button{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(10,15,31,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand img{width:38px;height:auto;filter:drop-shadow(0 0 8px rgba(25,211,197,.6))}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#9ff6ee 50%,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-align:start}
.top .sp{flex:1}
.tbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--teal);color:#fff}
.tbtn.hot{background:linear-gradient(90deg,var(--violet),var(--blue));border:0;color:#fff}
.progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--violet),var(--pink));z-index:60;transition:width .4s}
select.chap{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:600;max-width:340px}

/* cover */
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 120px}
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:3px solid #0b1022;aspect-ratio:3/2;max-height:78vh;width:100%;margin:6px auto 0;background:#000}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,24,.55) 0%,rgba(6,10,24,0) 34%,rgba(6,10,24,0) 62%,rgba(6,10,24,.85) 100%)}
.hero .title{position:absolute;inset-inline:0;top:4%;text-align:center;padding:0 4%}
.hero h1{font-family:var(--display);font-size:clamp(34px,6.4vw,86px);line-height:.95;margin:0;letter-spacing:1px;color:#fff;
  text-shadow:0 4px 0 #2a1d77,0 8px 0 #12093d,0 0 28px rgba(139,108,255,.85),0 0 60px rgba(25,211,197,.55);transform:rotate(-2deg)}
.hero h1 span{display:inline-block;animation:bounceIn .9s cubic-bezier(.2,1.6,.4,1) both}
.hero .sub{margin-top:14px;display:inline-block;background:rgba(10,15,31,.72);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 18px;font-weight:700;font-size:clamp(12px,1.5vw,17px)}
.hero .ctas{position:absolute;inset-inline:0;bottom:5%;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.big{font-size:17px;padding:13px 24px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#0b1022;background:var(--teal);border-radius:999px;padding:4px 10px}
.sec{margin:34px 0 10px;display:flex;align-items:baseline;gap:12px}
.sec h2{font-family:var(--display);font-size:28px;margin:0}
.sec p{margin:0;color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cc{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.cc img{width:84px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:bob 3.2s ease-in-out infinite}
.cc:nth-child(2) img{animation-delay:.5s}.cc:nth-child(3) img{animation-delay:1s}.cc:nth-child(4) img{animation-delay:1.5s}
.cc h3{margin:0 0 4px;font-size:18px}.cc p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}
.vil{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.vc{display:flex;gap:12px;align-items:center;background:#1a1235;border:1px solid #3d2a6e;border-radius:var(--r);padding:12px}
.vc img{width:92px;height:110px;object-fit:cover;border-radius:12px;border:2px solid #000}
.vc h3{margin:0 0 4px}.vc p{margin:0;color:#cdbcf7;font-size:13.5px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ch{position:relative;border-radius:var(--r);overflow:hidden;min-height:190px;cursor:pointer;border:2px solid #0b1022;box-shadow:var(--shadow);background:#000;text-align:start;color:#fff;padding:0}
.ch .im{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .6s}
.ch:hover .im,.ch:focus-visible .im{transform:scale(1.07)}
.ch .gr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,20,.05),rgba(5,8,20,.92) 72%)}
.ch .tx{position:absolute;inset-inline:14px;bottom:12px}
.ch .n{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--teal)}
.ch h3{margin:2px 0 4px;font-size:18px;line-height:1.2}
.ch .d{font-size:12.5px;color:#d8def6}
.ch .du{position:absolute;inset-inline-end:10px;top:10px;background:rgba(10,15,31,.8);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px}
.how kbd{background:#0b1022;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:#fff;font-family:var(--mono);font-size:12px}
.foot{margin-top:34px;color:var(--dim);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}

/* reader */
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:8px 0 12px}
.chead .num{font-family:var(--display);font-size:15px;color:var(--teal);letter-spacing:.6px;text-transform:uppercase}
.chead h2{margin:0;font-size:clamp(18px,2.4vw,26px);flex:1 1 420px}
.chead .du{font-weight:800;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chead .goal{flex-basis:100%;color:var(--muted);font-size:14px;margin-top:-4px}
.stage{position:relative}
.panel{position:relative;aspect-ratio:3/2;width:100%;border-radius:22px;overflow:hidden;border:4px solid #05070f;box-shadow:0 0 0 2px rgba(255,255,255,.12),var(--shadow);background:#000;cursor:pointer;user-select:none}
.panel img.pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.kb-a{animation:kbA 18s ease-in-out infinite alternate}
.kb-b{animation:kbB 18s ease-in-out infinite alternate}
.kb-c{animation:kbC 20s ease-in-out infinite alternate}
@keyframes kbA{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2.5%,-1.5%)}}
@keyframes kbB{from{transform:scale(1.1) translate(2%,1%)}to{transform:scale(1.02) translate(-1%,0)}}
@keyframes kbC{from{transform:scale(1.08) translate(-3%,0)}to{transform:scale(1.08) translate(3%,-1%)}}
.cap{position:absolute;inset-inline-start:1.4%;bottom:2.2%;max-width:62%;background:var(--cap);color:#2a2410;border:3px solid var(--bink);border-radius:6px;padding:7px 12px;font-weight:700;font-size:clamp(11px,1.25vw,15px);line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.55);transform:skew(-2deg);z-index:6}
.bub{position:absolute;z-index:7;background:var(--bubble);color:var(--bink);border:3px solid var(--bink);border-radius:20px;padding:9px 13px 10px;font-size:clamp(11px,1.32vw,16.5px);line-height:1.32;font-weight:650;box-shadow:4px 5px 0 rgba(0,0,0,.45);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.bub.hid{opacity:0;transform:scale(.6) translateY(10px);pointer-events:none}
.bub .who{display:inline-block;font-size:.72em;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;border-radius:999px;padding:1px 8px;margin-bottom:3px;margin-inline-end:6px}
.bub .tl{position:absolute;width:16px;height:16px;background:var(--bubble);border:3px solid var(--bink);transform:rotate(45deg)}
.bub .tl.b{bottom:-10px;left:var(--at);margin-left:-8px;border-top:0;border-left:0}
.bub .tl.t{top:-10px;left:var(--at);margin-left:-8px;border-bottom:0;border-right:0}
.bub .tl.l{left:-10px;top:var(--at);margin-top:-8px;border-top:0;border-right:0}
.bub .tl.r{right:-10px;top:var(--at);margin-top:-8px;border-bottom:0;border-left:0}
.bub.v{background:#f6efff}.bub.v .tl{background:#f6efff}
.who.sari{background:var(--c-sari)}.who.nova{background:var(--c-nova)}.who.orbi{background:var(--c-orbi)}.who.kubo{background:var(--c-kubo)}.who.lina{background:var(--c-lina)}.who.oni{background:var(--c-oni)}.who.vague{background:var(--c-vague)}.who.muncher{background:var(--c-muncher)}
.hint{position:absolute;inset-inline-end:1.4%;bottom:2.2%;z-index:8;background:rgba(10,15,31,.78);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;animation:blink 1.6s ease-in-out infinite}
.dlg{display:none}
/* fx */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(160,255,248,.55),rgba(139,108,255,.25) 40%,transparent 70%);mix-blend-mode:screen;animation:glow 2.8s ease-in-out infinite}
.pulse{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:3px solid rgba(160,255,248,.9);animation:ring 2.2s ease-out infinite}
.fdot{position:absolute;width:1.2%;aspect-ratio:1;border-radius:50%;background:#bffcf6;box-shadow:0 0 12px 4px rgba(25,211,197,.9);transform:translate(-50%,-50%);animation:fly var(--d,2.4s) linear infinite}
.conf{position:absolute;top:-6%;width:1%;height:2.2%;border-radius:2px;animation:fall var(--d,4s) linear infinite;opacity:.9}
@keyframes glow{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
@keyframes fly{0%{left:var(--x1);top:var(--y1);opacity:0}10%{opacity:1}90%{opacity:1}100%{left:var(--x2);top:var(--y2);opacity:0}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(120vh) rotate(540deg)}}
@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:translateY(14px) scale(.97)}100%{opacity:1;transform:none}}

/* info cards */
.sheet{position:relative;border-radius:22px;border:4px solid #05070f;box-shadow:0 0 0 2px rgba(255,255,255,.10),var(--shadow);background:
  linear-gradient(180deg,rgba(24,35,74,.96),rgba(15,22,48,.98)),
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/14px 14px;
  padding:22px 24px;min-height:min(62vh,640px);animation:popIn .45s ease both}
.sheet h3.t{font-family:var(--display);font-size:clamp(20px,2.6vw,30px);margin:4px 0 14px;letter-spacing:.3px}
.kick{display:inline-block;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#0b1022;background:var(--amber);border-radius:6px;padding:3px 9px;transform:skew(-6deg)}
.cardg{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:22px;align-items:start}
.aside{position:sticky;top:90px;text-align:center}
.aside img{width:100%;max-width:190px;height:auto;max-height:260px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));animation:bob 3.4s ease-in-out infinite}
.aside .say{position:relative;margin-top:10px;background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 10px;font-size:13.5px;font-weight:700;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
.aside .say:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-8px;width:14px;height:14px;background:#fff;border:3px solid var(--bink);border-bottom:0;border-right:0;transform:rotate(45deg)}
.body{font-size:16px;line-height:1.6;color:#e3e9ff}
.body h4{margin:12px 0 6px;font-size:17px;color:#a8fff6}
.body ul,.body ol{margin:6px 0 10px;padding-inline-start:22px}
.body li{margin:5px 0}
.body li b{color:#fff}
.body i{color:#ffd98a;font-style:normal}
.body code,.tbl code{font-family:var(--mono);font-size:.9em;background:#0b1022;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:#9ff6ee}
.note{background:rgba(255,181,71,.12);border:1px dashed rgba(255,181,71,.6);border-radius:12px;padding:10px 12px;color:#ffe2b0;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>div{background:rgba(10,15,31,.45);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.tblw{overflow:auto;border-radius:14px;border:1px solid var(--line);margin:6px 0 12px}
table.tbl{border-collapse:collapse;width:100%;font-size:14.5px;min-width:640px}
.tbl th{background:#1d2a5a;color:#fff;text-align:start;padding:10px 12px;font-size:13px;letter-spacing:.3px;position:sticky;top:0}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;color:#dfe6ff;line-height:1.45}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.tbl td:first-child{font-weight:700;color:#fff}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.scol{background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.scol h4{margin:4px 0 10px;font-size:16.5px;color:#a8fff6}
.scol ol{counter-reset:s;list-style:none;margin:0;padding:0}
.scol li{counter-increment:s;position:relative;padding:6px 0 8px 38px;line-height:1.5;font-size:15px;border-top:1px dashed rgba(255,255,255,.08)}
.scol li:first-child{border-top:0}
.scol li:before{content:counter(s);position:absolute;inset-inline-start:0;top:6px;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(139,108,255,.25)}
.scol.b li:before{background:linear-gradient(135deg,var(--teal),#0a8f86);box-shadow:0 0 0 3px rgba(25,211,197,.2)}
pre.code{position:relative;background:#070b18;border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:auto;font-family:var(--mono);font-size:14px;line-height:1.55;color:#d7e3ff;margin:4px 0 12px}
pre.code .k{color:#ff9bd2}pre.code .s{color:#9ff6ee}pre.code .c{color:#7d89b3}pre.code .h{color:#ffd98a;font-weight:700}
.copy{position:absolute;inset-inline-end:10px;top:10px;font-size:12px;padding:5px 10px}
.arch{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 40%,rgba(79,140,255,.08),transparent 70%);border-radius:14px}
.arch .grp rect:first-child{fill:rgba(255,255,255,.025);stroke-width:2;stroke-dasharray:7 6}
.arch .grp .tab{stroke:none}
.arch .gt{font-size:13px;font-weight:800;fill:#0b1022}
.arch .gt2{font-size:13px;font-weight:700;fill:#aab6dd}
.arch .mono{font-family:var(--mono);font-size:14px;fill:#d7e3ff;white-space:pre}
.arch .nd rect{stroke-width:2}
.arch .nd:hover rect,.arch .nd:focus rect{stroke-width:3.5;filter:drop-shadow(0 0 8px rgba(160,255,248,.6))}
.arch .nt{font-size:13.5px;font-weight:800;fill:#fff}
.arch .nt.big{font-size:15px}
.arch .ns{font-size:11.2px;fill:#c7d2f5}
.arch .gl{color:#d9e4ff}
.arch .k-m365 rect{fill:#13265a;stroke:#4f8cff}.arch .grp.k-m365 rect:first-child{stroke:#4f8cff}.arch .grp.k-m365 .tab{fill:#4f8cff}
.arch .k-studio rect{fill:#24184f;stroke:#8b6cff}.arch .grp.k-studio rect:first-child{stroke:#8b6cff}.arch .grp.k-studio .tab{fill:#a993ff}
.arch .k-proto rect{fill:#0d3236;stroke:#19d3c5}.arch .grp.k-proto rect:first-child{stroke:#19d3c5}.arch .grp.k-proto .tab{fill:#19d3c5}
.arch .k-gov rect{fill:#33270c;stroke:#ffb547}.arch .grp.k-gov rect:first-child{stroke:#ffb547}.arch .grp.k-gov .tab{fill:#ffb547}
.arch .k-ext rect{fill:#3a1e0d;stroke:#ff8a3d}.arch .grp.k-ext rect:first-child{stroke:#ff8a3d}.arch .grp.k-ext .tab{fill:#ff8a3d}
.arch .k-user rect{fill:#1d2438;stroke:#c7d2f5}
.arch .k-q rect{fill:#102043;stroke:#ffd98a;stroke-dasharray:5 3}
.arch .eg{fill:none;stroke-width:2.4;stroke:#7fb2ff}
.arch .eg.flow{stroke:#7fb2ff}.arch .eg.flow2{stroke:#b9a6ff}.arch .eg.flow3{stroke:#4fe6d8}.arch .eg.gov{stroke:#ffb547;stroke-width:1.6}
.arch .eg.dash{stroke-dasharray:7 6;animation:dash 1.1s linear infinite}
.arch .arh{fill:#c9d8ff}
.arch .dt{fill:#e9fffd;filter:drop-shadow(0 0 5px #19d3c5)}
.arch .dt.flow2{fill:#efe9ff;filter:drop-shadow(0 0 5px #8b6cff)}
.arch .el rect{fill:#0b1022;stroke:#3a4c8c}
.arch .el text{font-size:11.5px;font-weight:800;fill:#ffe7a8;text-anchor:middle}
.arch .bd circle{fill:#ff5fa2;stroke:#fff;stroke-width:2}
.arch .bd text{font-size:13px;font-weight:900;fill:#fff;text-anchor:middle}
.arch .bd{animation:bdg 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.arch .pop{animation:popIn .5s ease both}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes bdg{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}}
.cap2{color:var(--muted);font-size:14.5px;line-height:1.55;margin:10px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12.5px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* villain */
.vgrid{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:22px;align-items:start}
.vimg{position:relative}
.vimg img{width:100%;border-radius:16px;border:3px solid #000;box-shadow:0 0 0 3px #8e44ad,0 0 40px rgba(142,68,173,.5);animation:shake 3.5s ease-in-out infinite}
.vname{font-family:var(--display);font-size:24px;color:#e4c8ff;margin:10px 0 0;text-align:center}
.attack{position:relative;background:#f6efff;color:#2a1240;border:3px solid #120822;border-radius:20px;padding:12px 16px;font-weight:800;font-size:16.5px;box-shadow:4px 5px 0 rgba(0,0,0,.45);margin-bottom:16px}
.attack:before{content:"VILLAIN";position:absolute;top:-12px;inset-inline-start:14px;background:#8e44ad;color:#fff;font-size:11px;letter-spacing:1px;border-radius:999px;padding:2px 8px}
.counter h4{margin:0 0 8px;color:#a8fff6}
.counter li{margin:8px 0;line-height:1.55}
@keyframes shake{0%,92%,100%{transform:rotate(0)}94%{transform:rotate(-2deg)}96%{transform:rotate(2deg)}98%{transform:rotate(-1deg)}}
/* quiz */
.q{background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.q p{margin:0 0 10px;font-weight:700;font-size:16px;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:start;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:#2fd38a;background:rgba(47,211,138,.15)}
.opt.no{border-color:#ff5f6d;background:rgba(255,95,109,.12)}
.why{display:none;margin-top:10px;font-size:14px;color:#cfe;line-height:1.5}
.why.on{display:block;animation:popIn .3s ease both}
.score{float:inline-end;font-weight:900;color:var(--amber)}
/* cta / recap */
.ctab{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.recap{counter-reset:r;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0 16px;padding:0;list-style:none}
.recap li{display:flex;gap:10px;align-items:flex-start;background:rgba(10,15,31,.5);border:1px solid var(--line);border-radius:14px;padding:10px 12px;line-height:1.45}
.recap li b{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff}
/* nav + sources */
.nav{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.nav .pg{flex:1;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#33427a;cursor:pointer;padding:0}
.dots button.on{background:var(--teal);box-shadow:0 0 0 3px rgba(25,211,197,.25)}
.srcs{margin-top:10px;background:rgba(10,15,31,.55);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.srcs b{font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.srcs ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.srcs li a{display:inline-block;font-size:13px;text-decoration:none;color:#cfe;background:#0e1938;border:1px solid #2a3d7a;border-radius:999px;padding:4px 10px}
.srcs li a:hover{border-color:var(--teal);color:#fff}
.srcs li span{color:var(--dim);font-size:11.5px;margin-inline-start:4px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:70;background:linear-gradient(90deg,var(--violet),var(--blue));color:#fff;font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:var(--shadow);animation:popIn .3s ease both}
/* guide */
.guide{position:fixed;inset-inline-end:16px;bottom:14px;z-index:50;display:flex;align-items:flex-end;gap:8px;pointer-events:none}
.guide img{width:86px;height:auto;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));pointer-events:auto;cursor:pointer}
.guide .gtip{max-width:260px;background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 11px;font-size:13px;font-weight:700;box-shadow:3px 4px 0 rgba(0,0,0,.45);margin-bottom:46px;pointer-events:auto}
.guide.min .gtip{display:none}
/* sources page */
.sgrp{margin:18px 0}
.sgrp h3{margin:0 0 8px;color:#a8fff6}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.slist li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.slist li a{font-weight:700;text-decoration:none}
.slist li .m{display:block;color:var(--dim);font-size:12.5px;margin-top:3px;word-break:break-all}
@media (max-width:860px){
  .cardg,.vgrid,.two,.steps{grid-template-columns:1fr}
  .aside{position:static;display:flex;gap:12px;align-items:center;text-align:start}
  .aside img{max-width:90px}
  .aside .say:before{display:none}
  .opts{grid-template-columns:1fr}
  .panel .bub{display:none}
  .dlg{display:block;margin-top:10px}
  .dlg .line{background:#fff;color:var(--bink);border:3px solid var(--bink);border-radius:16px;padding:8px 12px;margin:8px 0;font-weight:650;box-shadow:3px 4px 0 rgba(0,0,0,.4)}
  .dlg .line.hid{display:none}
  .cap{max-width:92%}
  .guide img{width:62px}.guide .gtip{display:none}
  .brand small{display:none}
  select.chap{max-width:150px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  .arch .dt{display:none}
}

.cpb svg{width:16px;height:16px;color:#0f8f86}
.cpb .n{margin-inline-start:auto;font-size:11.5px;background:#d9efed;color:#0b5d57;border-radius:999px;padding:1px 7px}
.sdlg{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(20,40,40,.3);width:min(620px,100%);padding:18px 20px;position:relative;max-height:92%;overflow:auto}
.drop{border:2px dashed #9fd3cf;border-radius:14px;padding:18px;text-align:center;color:#3f5656;background:#f3fbfa;font-size:13.5px}
.srcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.srct{border:1px solid #e1e8e8;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:#244040;background:#fff;display:flex;align-items:center;gap:8px}
.srct svg{width:18px;height:18px;color:#0f8f86}
.reason{background:#f3f7ff;border:1px dashed #9db4ff;border-radius:12px;padding:8px 10px;font-size:12.5px;color:#2b3a77;margin:6px 0}
.reason ol{margin:4px 0 0;padding-inline-start:18px}
.mtbl{border-collapse:collapse;font-size:12.5px;margin:6px 0}
.mtbl td,.mtbl th{border:1px solid #dde3f0;padding:4px 7px;text-align:start}
.mtbl th{background:#f3f5fb}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid #e1e8e8;border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;color:#9aa8a8}
.kpi span{font-size:12.5px;color:#4d6262;font-weight:700}
@media (max-width:1050px){.dgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:700px){.lp{display:none}.studio .sn{display:none}.sbody{grid-template-columns:1fr}.grid3,.store,.srcg,.kpis{grid-template-columns:1fr 1fr}}
</style>

pilot/extensibility/agent-builder-add-skills","2026-11-11"],"cs-billing":["Overview of usage-based billing (Copilot Studio)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/billing-credit-overview","2026-10-21"],"cs-build-new-agent":["Create a new agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/build-new-agent","2026-11-12"],"cs-channels":["Available channels for agents (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/publication-channels-overview","2026-10-15"],"cs-harness-overview":["About agents powered by the Microsoft Copilot harness","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/overview","2026-11-12"],"cs-knowledge":["Add knowledge sources to an agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/knowledge-add-existing-copilot","2026-10-28"],"cs-memory":["Memory (Microsoft Copilot harness) (preview)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/memory-overview","2026-10-21"],"cs-model":["Select a model for an agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/authoring-select-agent-model","2026-10-21"],"cs-publish":["Publish an agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/publication-publish-agent","2026-10-15"],"cs-publish-overview":["Publish overview for agents (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/publication-fundamentals-publish-channels","2026-10-12"],"cs-quickstart-std":["Quickstart: Create and deploy an agent with the standard harness","https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-get-started","2026-09-22"],"cs-share":["Share agents with other users and makers (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/authoring-share-agent","2026-10-20"],"cs-skills-create":["Create a skill for an agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/skills-create","2026-11-12"],"cs-teams":["Connect and configure an agent for Teams and Microsoft Copilot","https://learn.microsoft.com/en-us/microsoft-copilot-studio/publication-add-bot-to-microsoft-teams","2026-10-29"],"cs-test":["Test your agent (Microsoft Copilot harness)","https://learn.microsoft.com/en-us/microsoft-copilot-studio/agents-experience/authoring-test-bot","2026-10-21"],"m365-arch":["Microsoft Copilot architecture and how it works","https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-architecture","2026-09-14"]};window.DEMOS=[{"id":"m365","title":"Microsoft 365 Copilot: Agent Builder","agent":"Onboarding Buddy","url":"copilot.cloud.microsoft","intro":"Build Onboarding Buddy, a declarative agent, in Microsoft Copilot with Agent Builder.","stages":[{"name":"Adding knowledge","alt":"Natural-language path: on the Describe tab, select + in the chat box to add work content, upload files, or attach cloud files.","altsrc":"ab-knowledge","steps":[{"screen":"cp-home","hot":"nav-agents","say":"Open <b>Agents &amp; Skills<\/b> in Copilot chat.","learn":"In Copilot chat, select Agents & Skills, then New agent.","src":["ab-skills"]},{"screen":"agents","hot":"new-agent","say":"Select <b>New agent<\/b>.","learn":"New agent opens Agent Builder: describe the agent in natural language (recommended), configure it manually, or start from a template.","src":["ab-build"]},{"screen":"ab-describe","hot":"skip","say":"Select <b>Skip to configure<\/b> so you can see every field.","learn":"Describing the agent is the recommended path: Agent Builder then fills in the name, description, instructions, knowledge and suggested prompts for you.","src":["ab-build"]},{"screen":"ab-config","hot":"kn-url","type":"https://contoso.sharepoint.com/sites/HR-Onboarding","set":{"kn_sp":1},"say":"In <b>Knowledge<\/b>, enter the HR site URL, then press Enter.","learn":"A SharePoint link must include the site path and no query parameters. The agent searches the URL and its subpaths. Limits: up to 100 SharePoint files and 1 list.","src":["ab-knowledge"]},{"screen":"ab-config","hot":"kn-upload","set":{"kn_file":1},"say":"Select <b>Upload<\/b> to add <i>First-week-checklist.docx<\/i> from your device.","learn":"Uploaded files become embedded content (up to 20 files). Anyone who has access to the agent also has access to the information in those files.","src":["ab-knowledge"]},{"screen":"ab-config","hot":"kn-status","set":{"kn_ready":1},"say":"The new SharePoint content shows <b>Preparing<\/b>. Wait until it's ready.","learn":"You can test while a source is preparing, but the agent doesn't use it until it's ready.","src":["ab-knowledge"]},{"screen":"ab-config","hot":"only-src","set":{"only":1},"say":"Turn on <b>Only use specified sources<\/b>.","learn":"This prioritizes your sources. It doesn't block general AI knowledge; for stricter control, Learn points to Copilot Studio.","src":["ab-knowledge"]}]},{"name":"Create agent","alt":"Template path: under Start with a template, pick a template that comes preconfigured with a description, instructions and prompts, then refine it.","altsrc":"ab-build","steps":[{"screen":"ab-config","hot":"f-name","type":"Onboarding Buddy","set":{"name":1},"say":"Enter the <b>Name<\/b>.","learn":"Name: up to 30 characters. Make it descriptive and unique.","src":["ab-build"]},{"screen":"ab-config","hot":"f-desc","type":"Answers Contoso new-hire questions about HR policies, the first-week checklist and IT setup.","set":{"desc":1},"say":"Enter the <b>Description<\/b>.","learn":"Up to 1,000 characters. The description helps the LLM identify when to use the agent, and users see it too.","src":["ab-build"]},{"screen":"ab-config","hot":"f-instr","type":"You are Onboarding Buddy for Contoso new hires. Answer only from the HR onboarding site and the first-week checklist, and cite the source. If the answer isn't there, say so and suggest contacting HR. Keep answers short and friendly.","set":{"instr":1},"say":"Write the <b>Instructions<\/b>.","learn":"Up to 8,000 characters. Instructions direct the agent's behavior: its tasks and how it completes them.","src":["ab-build"]},{"screen":"ab-config","hot":"f-prompts","set":{"prompts":1},"say":"Add <b>Starter prompts<\/b>.","learn":"Starter prompts show users the scenarios the agent supports. Each has a name and a description.","src":["ab-build"]},{"screen":"ab-config","hot":"cap-code","set":{"cap":1},"say":"Turn on <b>Create documents, charts, and code<\/b>.","learn":"This adds the code interpreter capability. Create images adds the image generator.","src":["ab-build"]},{"screen":"ab-config","hot":"model","say":"Leave the <b>Model<\/b> response mode on <b>Auto<\/b>.","learn":"Auto (the default) balances speed and depth. Users can override it with Quick response or Think deeper.","src":["ab-build"]},{"screen":"ab-config","hot":"btn-create","set":{"created":1},"say":"Select <b>Create<\/b>.","learn":"After creation, a confirmation message says the agent is private and only available to you.","src":["ab-share"]},{"screen":"ab-created","hot":"dlg-close","say":"The agent is <b>private<\/b> for now. Close the message: you'll share it in step 4.","learn":"To share it with others, you'd select Share. We'll do that when we publish.","src":["ab-share"]}]},{"name":"Use agent","alt":"Try it isn't the full experience: sharing prompts, feedback and @mentioning other agents work only after you create the agent.","altsrc":"ab-build","steps":[{"screen":"ab-tryit","hot":"try-prompt","set":{"try":1},"say":"On <b>Try it<\/b>, select a suggested prompt.","learn":"Try it follows the same instructions and knowledge as the created agent.","src":["ab-build"]},{"screen":"ab-tryit","hot":"try-cite","say":"Check that the answer <b>cites your sources<\/b>.","learn":"Verify knowledge by asking something only your sources can answer, then confirm the response uses that information. (The answer shown is simulated.)","src":["ab-knowledge"]},{"screen":"cp-home","hot":"nav-ob","set":{"inpane":1},"say":"Open <b>Onboarding Buddy<\/b> from the left pane.","learn":"Agents you use recently appear in the left pane. All agents shows the rest.","src":["ab-share"]},{"screen":"cp-agent","hot":"chat-input","type":"How do I request my laptop?","set":{"asked":1},"say":"Ask the agent a question.","learn":"The agent answers within the permissions of the person asking. Users without access to a source get no answers from it. (Response simulated.)","src":["ab-share","m365-arch"]},{"screen":"cp-mention","hot":"mention-ob","say":"In any Copilot chat, type <b>@<\/b> and pick the agent.","learn":"@mentioning agents in the Microsoft 365 Copilot app works once the agent is created (not inside Try it).","src":["ab-build"]}]},{"name":"Publish agent","alt":"Sharing limits set by your admin apply only to the shared version. Admin availability settings control who sees the Agent Store version.","altsrc":"ab-catalog","steps":[{"screen":"ab-config","hot":"btn-share","say":"Back in the agent, select <b>Share<\/b>.","learn":"Sharing gives direct access to the users you specify. Agents support multiple owners.","src":["ab-share"]},{"screen":"ab-share","hot":"share-input","type":"Contoso New Hires","set":{"picked":1},"say":"Type a <b>name, group, or email<\/b>.","learn":"Can edit = owner (full rights). Can chat = chat user. A group can only be added as Can chat.","src":["ab-share"]},{"screen":"ab-share","hot":"share-add","set":{"shared":1},"say":"Keep <b>Can chat<\/b> and <b>Send notification<\/b>, then select <b>Add<\/b>.","learn":"Shared SharePoint knowledge can be shared automatically, but the agent still respects each user's permissions and sensitivity labels.","src":["ab-share"]},{"screen":"ab-share","hot":"org-toggle","say":"Note <b>Org-wide sharing for chat access<\/b>. Leave it off for now.","learn":"When it's on, everyone in your tenant can find the agent in the Agent Store. Admins can allow it for all users, specific users or groups, or no one.","src":["ab-share"]},{"screen":"ab-share","hot":"submit-link","say":"Select <b>Submit to your catalog<\/b>.","learn":"Also available from More (...) > Submit to your org catalog. The agent must be published at least once.","src":["ab-catalog"]},{"screen":"ab-submit","hot":"sub-continue","say":"Complete the required fields, then select <b>Continue<\/b>.","learn":"Display name (30), short description (80), developer name (32), and valid HTTPS links for the creator website, privacy statement and terms of use.","src":["ab-catalog"]},{"screen":"ab-submitted","hot":"status","say":"The status shows <b>Submitted for admin approval<\/b>.","learn":"An admin reviews it in the Microsoft 365 admin center: name, description, capabilities, knowledge sources, sensitivity label and developer information.","src":["ab-catalog"]},{"screen":"ab-approved","hot":"go-store","say":"Later, the banner shows <b>Approved<\/b>. Select <b>Go to Agent Store<\/b>.","learn":"If an admin rejects it, the banner includes the reviewer's comment.","src":["ab-catalog"]},{"screen":"store","hot":"store-card","say":"Onboarding Buddy is in the Agent Store under <b>Built by your org<\/b>.","learn":"Update changes the shared version right away. The Agent Store version changes only after you resubmit and an admin approves.","src":["ab-catalog"]}]}]},{"id":"studio","title":"Copilot Studio: Microsoft Copilot harness","agent":"Onboarding Orchestrator","url":"copilotstudio.microsoft.com","intro":"Build Onboarding Orchestrator in Copilot Studio on the Microsoft Copilot harness (the new agent experience; some Learn pages call it the GitHub Copilot harness).","stages":[{"name":"Adding knowledge","alt":"Standard harness: on the agent's Overview page, use the Knowledge section to add sources, for example the suggested website, then select Add to agent.","altsrc":"cs-quickstart-std","steps":[{"screen":"cs-home","hot":"tile-agent","say":"On <b>Home<\/b>, select the <b>Agent<\/b> tile.","learn":"You can also go to Agents > New agent. On this harness, building, testing and evaluating can consume Copilot Credits (usage-based billing).","src":["cs-build-new-agent","cs-billing"]},{"screen":"cs-design","hot":"name","type":"Onboarding Orchestrator","set":{"name":1},"say":"The designer opens on the <b>Build<\/b> tab with the name field in focus. Enter a name.","learn":"The last name you enter before the first save sets the schema name, which then becomes read-only. Agent settings let you change language, solution and schema name first.","src":["cs-build-new-agent"]},{"screen":"cs-design","hot":"save","set":{"saved":1},"say":"Select the <b>Save<\/b> icon.","learn":"After saving, you can add knowledge, tools, skills, connected agents, the model and memory.","src":["cs-build-new-agent"]},{"screen":"cs-design","hot":"comp-knowledge","say":"In the components panel, select <b>Knowledge<\/b>.","learn":"The Add knowledge dialog opens.","src":["cs-knowledge"]},{"screen":"cs-addk","hot":"drop","set":{"kfile":1},"say":"Drop <i>Contoso-Onboarding-Policy.pdf<\/i> into the upload area.","learn":"The drag-and-drop upload area is always available on this harness.","src":["cs-knowledge"]},{"screen":"cs-addk","hot":"src-sp","say":"Under Featured, select <b>SharePoint<\/b>.","learn":"Featured types include public websites, SharePoint, OneDrive for Business, Salesforce, ServiceNow and Azure SQL. The Advanced tab has more, such as Azure DevOps and Custom Connector.","src":["cs-knowledge"]},{"screen":"cs-sp","hot":"sp-url","type":"https://contoso.sharepoint.com/sites/HR-Onboarding","set":{"spurl":1},"say":"Enter the site to use.","learn":"Follow the configuration steps for the selected source type. The fields shown here are illustrative.","src":["cs-knowledge"]},{"screen":"cs-sp","hot":"sp-add","set":{"ksp":1},"say":"Select <b>Add<\/b> to confirm.","learn":"If your organization blocks a source type, it appears disabled in the dialog (the Knowledge sources for agents setting in the Power Platform admin center).","src":["cs-knowledge"]},{"screen":"cs-design","hot":"kn-list","say":"Both sources now appear under <b>Knowledge<\/b>.","learn":"There is no general-knowledge on/off switch on this harness: the sources you add define what the agent can access.","src":["cs-knowledge"]}]},{"name":"Create agent","alt":"Standard harness: describe the agent on Home (up to 1,024 characters). AI generates the name, description and instructions, which you edit on the Overview page.","altsrc":"cs-quickstart-std","steps":[{"screen":"cs-design","hot":"instr","type":"You are Onboarding Orchestrator for Contoso. Help new hires and their managers with onboarding. Use the HR knowledge for policies and the new-hire-welcome-pack skill for welcome packs. Cite sources. Never share personal data.","set":{"instr":1},"say":"In <b>Instructions<\/b>, describe the role, tone and rules.","learn":"Instructions define the agent's identity, tone, scope and behavior.","src":["cs-build-new-agent","cs-harness-overview"]},{"screen":"cs-design","hot":"comp-model","set":{"model":1},"say":"Choose a model from the <b>Model<\/b> list.","learn":"Available models vary. Admins control preview, experimental and external models per environment.","src":["cs-model"]},{"screen":"cs-design","hot":"comp-skills","say":"Select <b>Skills<\/b>, then <b>Add skill<\/b>.","learn":"Three ways to add a skill: upload a skill file or package, create from blank, or generate with AI.","src":["cs-skills-create"]},{"screen":"cs-skill","hot":"sk-blank","say":"Choose <b>Create from blank<\/b>.","learn":"Generate with AI asks you questions, builds the skill, and lets you View, download or Add to agent.","src":["cs-skills-create"]},{"screen":"cs-skillform","hot":"sk-name","type":"new-hire-welcome-pack","set":{"skname":1},"say":"Enter the skill <b>Name<\/b>.","learn":"Use only lowercase letters, numbers and hyphens, and don't start or end with a hyphen.","src":["cs-skills-create"]},{"screen":"cs-skillform","hot":"sk-desc","type":"Builds a first-week welcome pack for a named new hire. Use when someone asks to prepare a welcome pack or onboarding checklist.","set":{"skdesc":1},"say":"Enter the <b>Description<\/b>: what the skill does and when to use it.","learn":"The description helps the orchestration runtime decide when to invoke the skill.","src":["cs-skills-create"]},{"screen":"cs-skillform","hot":"sk-create","set":{"skill":1},"say":"Add Markdown <b>Instructions<\/b>, then select <b>Create<\/b>.","learn":"Include steps, response formats, edge cases and the tools to use. You can edit them later.","src":["cs-skills-create"]},{"screen":"cs-design","hot":"comp-memory","set":{"memory":1},"say":"Optional: turn on <b>Memory<\/b> (preview).","learn":"Each user's memories are private to that user. They're deleted after 28 days without interaction, and memory is off in group chats and Teams channels.","src":["cs-memory"]},{"screen":"cs-design","hot":"save","say":"Select <b>Save<\/b>.","learn":"Changes stay in draft until you publish.","src":["cs-publish-overview"]}]},{"name":"Use agent","alt":"Standard harness: use the Test your agent chat panel. Select the intro message to edit the Conversation Start topic.","altsrc":"cs-quickstart-std","steps":[{"screen":"cs-design","hot":"tab-preview","say":"Select the <b>Preview<\/b> tab.","learn":"Until you publish, the agent is only available in the preview pane.","src":["cs-test","cs-publish-overview"]},{"screen":"cs-preview","hot":"pv-input","type":"Prepare a welcome pack for Raka, who joins Finance on 1 December.","set":{"asked":1},"say":"Type a message and send it.","learn":"The agent uses its instructions, knowledge, skills and tools to respond. (Response simulated.)","src":["cs-test"]},{"screen":"cs-preview","hot":"pv-reason","say":"Open the <b>reasoning card<\/b>.","learn":"In the maker view, the reasoning card shows the agent's processing steps. The activity trace shows which tool ran and what it returned.","src":["cs-test"]},{"screen":"cs-preview","hot":"pv-eu","set":{"eu":1},"say":"Toggle <b>End user preview<\/b>.","learn":"Switch between the maker view and the end-user view to check answers and citations.","src":["cs-test"]},{"screen":"cs-preview","hot":"pv-thumb","set":{"thumb":1},"say":"Give the answer a <b>thumbs up<\/b>.","learn":"Thumbs up or down, plus a comment, help you track quality as you iterate.","src":["cs-test"]},{"screen":"cs-preview","hot":"pv-new","say":"Select <b>New chat<\/b> to start fresh.","learn":"Edits on the Build tab apply from the next turn, so you don't need a new conversation for each change. Use Evaluate for repeatable test sets.","src":["cs-test"]}]},{"name":"Publish agent","alt":"Standard harness: Publish, then Channels > Teams and Microsoft Copilot > Add channel. Use Availability options to share a link, show the agent to teammates, or request admin approval for the organization.","altsrc":"cs-teams","steps":[{"screen":"cs-preview","hot":"publish","say":"Select <b>Publish<\/b>.","learn":"Before publishing, the agent needs a name, description and instructions, saved changes and a tested draft.","src":["cs-publish","cs-publish-overview"]},{"screen":"cs-pub","hot":"ch-copilot","set":{"chc":1},"say":"Select the <b>Microsoft Copilot<\/b> channel.","learn":"This makes the agent available in Microsoft Copilot's agent list.","src":["cs-channels"]},{"screen":"cs-pub","hot":"ch-teams","set":{"cht":1},"say":"Select <b>Microsoft Teams<\/b>.","learn":"Channels blocked by your organization's data policies can't be selected.","src":["cs-channels","cs-publish"]},{"screen":"cs-pub","hot":"pub-go","set":{"pubbed":1},"say":"Select <b>Publish<\/b> to confirm.","learn":"Each publish creates a new version. If publishing fails, the dialog shows the error and a Retry option.","src":["cs-publish","cs-publish-overview"]},{"screen":"cs-pubok","hot":"pub-share","say":"Publishing succeeded. Select <b>Share<\/b>.","learn":"The success dialog also offers to add the agent to the organization catalog.","src":["cs-publish"]},{"screen":"cs-share","hot":"org-access","set":{"eua":1},"say":"Under <b>Organization<\/b>, choose <b>End user access<\/b>.","learn":"Anyone in your organization can then find and use the agent, but can't see its details or edit it. Sharing with named users or groups gives them view-and-test access.","src":["cs-share"]},{"screen":"cs-share","hot":"share-go","say":"Select <b>Share<\/b>.","learn":"Prerequisites include Authenticate with Microsoft and publishing to Teams and Microsoft 365, with Make agent available in Microsoft Copilot turned on.","src":["cs-share"]},{"screen":"cp-studio-agent","hot":"cp-orch","say":"Users find <b>Onboarding Orchestrator<\/b> in Microsoft Copilot.","learn":"The Microsoft Copilot channel lists the agent in Microsoft Copilot's agent list. (Screen simulated.)","src":["cs-channels"]},{"screen":"cs-monitor","hot":"mon","say":"Back in Copilot Studio, open <b>Monitor<\/b>.","learn":"Monitor shows production health, outcomes, sessions and credit usage once people use the published agent.","src":["cs-harness-overview","cs-billing"]}]}]}];</script>
<script>(function(){
"use strict";
var DEMOS = window.DEMOS, SRC = window.SRC, IMG = window.IMG;
var scr = document.getElementById("scr"), layer = document.getElementById("layer"), win = document.getElementById("win");
var addr = document.getElementById("addr"), side = document.getElementById("side"), stg = document.getElementById("stg");
var seg = document.getElementById("seg"), ttl = document.getElementById("dtitle");
var cur = {d: 0, i: 0}, busy = false;

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function ic(n){ return '<svg aria-hidden="true"><use href="#' + n + '"/></svg>'; }
function flat(d){ var a = []; d.stages.forEach(function(s, si){ s.steps.forEach(function(st, k){ a.push({si: si, k: k, st: st}); }); }); return a; }
function stateAt(d, idx){
  var st = {typed: {}};
  flat(d).slice(0, idx).forEach(function(x){ var s = x.st.set || {}; Object.keys(s).forEach(function(k){ st[k] = s[k]; }); if (x.st.type) st.typed[x.st.hot] = x.st.type; });
  return st;
}
function val(st, hot, ph){ return st.typed[hot] ? '<span class="val">' + esc(st.typed[hot]) + '</span>' : '<span class="ph">' + esc(ph) + '</span>'; }
function tg(label, on, hot){ return '<div class="tg"' + (hot ? ' data-hot="' + hot + '"' : "") + '><span>' + esc(label) + '</span><span class="sw' + (on ? " on" : "") + '"></span></div>'; }
function fld(label, hot, st, ph, lim, ta){ var v = st.typed[hot] || ""; return '<div class="fld"><label>' + esc(label) + (lim ? '<span class="cnt">' + v.length + " / " + lim.toLocaleString("en-US") + "</span>" : "") + '</label><div class="inp' + (ta ? " ta" : "") + '" data-hot="' + hot + '">' + val(st, hot, ph) + "</div></div>"; }
function av(t, c, sz){ return '<span class="av" style="background:' + c + (sz ? ";width:" + sz + "px;height:" + sz + "px;border-radius:" + Math.round(sz / 3.5) + "px;font-size:" + Math.round(sz / 2.6) + "px" : "") + '">' + esc(t) + "</span>"; }

/* ---------- Microsoft Copilot (simulated) ---------- */
function lp(st, on){
  var h = '<div class="lp"><div class="brandm"><span></span>Microsoft Copilot</div>';
  h += '<button class="li' + (on === "chat" ? " on" : "") + '" type="button">' + ic("g-chat") + "Chat</button>";
  h += '<button class="li' + (on === "agents" ? " on" : "") + '" type="button" data-hot="nav-agents">' + ic("g-robot") + "Agents &amp; Skills</button>";
  h += '<button class="li' + (on === "all" ? " on" : "") + '" type="button">' + ic("g-store") + "All agents</button>";
  h += '<div class="lh">Agents</div>';
  h += '<button class="li" type="button">' + av("R", "#4f8cff") + "Researcher</button>";
  if (st.created) h += '<button class="li' + (on === "ob" ? " on" : "") + '" type="button" data-hot="nav-ob">' + av("OB", "#0fb3a6") + "Onboarding Buddy</button>";
  return h + "</div>";
}
function mapp(left, main){ return '<div class="app">' + left + '<div class="mn">' + main + "</div></div>"; }
function abh(st, tab){
  var t = st.name ? "Onboarding Buddy" : "New agent";
  var h = '<div class="abh">' + av(st.name ? "OB" : "+", "#0fb3a6", 34) + '<span class="t">' + esc(t) + '<span class="muted" style="display:block;font-weight:600;font-size:12px">Agent Builder</span></span><div class="tabs">';
  ["Describe", "Configure", "Try it"].forEach(function(x){ h += '<span class="tab' + (x === tab ? " on" : "") + '">' + x + "</span>"; });
  h += '</div><span style="flex:1"></span>';
  if (!st.created) h += '<button class="btnp" type="button" data-hot="btn-create">Create</button>';
  else h += '<button class="btns2" type="button">Update</button><button class="btnp" type="button" data-hot="btn-share">Share</button><button class="btns2" type="button" aria-label="More">…</button>';
  return h + "</div>";
}
function abConfig(st){
  var h = abh(st, "Configure");
  h += fld("Name", "f-name", st, "Name your agent", 30);
  h += '<div class="fld"><label>Icon</label><div style="display:flex;gap:10px;align-items:center">' + av("OB", "#0fb3a6", 40) + '<span class="muted">Generate, Browse or Upload (PNG, 192 x 192, up to 1 MB)</span></div></div>';
  h += fld("Description", "f-desc", st, "Describe what the agent does and when to use it", 1000, true);
  h += fld("Instructions", "f-instr", st, "Tell the agent how to behave", 8000, true);
  h += '<div class="fld"><label>Model</label><div class="segm" data-hot="model"><span class="on">Auto</span><span>Quick response</span><span>Think deeper</span></div></div>';
  h += '<div class="fld"><label>Knowledge</label><div class="kn"><div class="knrow"><div class="inp" data-hot="kn-url">' + val(st, "kn-url", "Search, or enter a URL") + '</div><span class="ib" title="Search">' + ic("g-globe") + '</span><span class="ib" title="Attach cloud files">' + ic("g-cloud") + '</span><span class="ib" title="Upload" data-hot="kn-upload">' + ic("g-doc") + "</span></div>";
  if (st.kn_sp) h += '<div class="kitem" data-hot="kn-status">' + ic("g-doc") + ' HR-Onboarding (SharePoint site)<span class="st ' + (st.kn_ready ? "ok" : "prep") + '">' + (st.kn_ready ? "Ready" : "Preparing") + "</span></div>";
  if (st.kn_file) h += '<div class="muted" style="margin-top:8px;font-weight:700">Uploaded files</div><div class="kitem">' + ic("g-doc") + ' First-week-checklist.docx<span class="st ok">Uploaded</span></div>';
  h += tg("Search all websites", false) + tg("Only use specified sources", st.only, "only-src") + tg("Reference people in organization", true) + "</div></div>";
  h += '<div class="fld"><label>Capabilities</label><div class="kn">' + tg("Create documents, charts, and code", st.cap, "cap-code") + tg("Create images", false) + "</div></div>";
  h += '<div class="fld"><label>Skills</label><div class="kn"><span class="muted">Upload a skill package (.zip) or describe a skill in natural language.</span><div style="margin-top:8px"><button class="btns2" type="button">Add</button></div></div></div>';
  h += '<div class="fld"><label>Starter prompts</label><div class="kn" data-hot="f-prompts">' + (st.prompts ? '<div class="kitem">What\'s on my first-week checklist?</div><div class="kitem">How do I request my laptop?</div>' : '<span class="ph" style="color:#7b5cff;font-weight:700">+ Add a starter prompt</span>') + "</div></div>";
  return mapp(lp(st, "agents"), h);
}
function ovl(inner){ return '<div class="ovl"><div class="dlg2">' + inner + "</div></div>"; }
var S = {};
S["cp-home"] = function(st){ return mapp(lp(st, "chat"), '<div class="hello">Hi Sari, how can I help?</div><div class="muted">Simulated Microsoft Copilot</div><div class="cbox"><span class="plus">+</span><span class="ph">Message Copilot</span></div><div class="chips"><span class="chip">Summarize my unread email</span><span class="chip">Prep for my next meeting</span><span class="chip">Draft a status update</span></div>'); };
S["agents"] = function(st){ return mapp(lp(st, "agents"), '<div class="h2">Agents &amp; Skills</div><div style="margin-bottom:14px"><button class="btnp" type="button" data-hot="new-agent">+ New agent</button></div><div class="sec2">My agents</div><div class="tcard">No agents yet. This list shows agents you own or can edit.</div>'); };
S["ab-describe"] = function(st){ return mapp(lp(st, "agents"), abh(st, "Describe") + '<div class="msg a">Hi! Describe the agent you want, and I\'ll set up its name, description, instructions, knowledge and suggested prompts.</div><div class="sec2">Start with a template</div><div class="grid3"><div class="tcard"><b>Team onboarding</b>Help new team members get started</div><div class="tcard"><b>Writing coach</b>Feedback against your standards</div><div class="tcard"><b>Project info</b>Answers from project content</div></div><div class="cbox"><span class="plus">+</span><span class="ph">Message Agent Builder</span></div><div style="text-align:end;margin-top:12px"><button class="btns2" type="button" data-hot="skip">Skip to configure</button></div>'); };
S["ab-config"] = function(st){ return abConfig(st); };
S["ab-created"] = function(st){ return [abConfig(st), ovl('<span class="x" data-hot="dlg-close">×</span><h4>Onboarding Buddy is created</h4><p class="muted">Your agent is private and only available to you.</p><div style="margin-top:12px"><button class="btnp" type="button">Share</button></div>')]; };
S["ab-tryit"] = function(st){
  var h = abh(st, "Try it") + '<div class="muted">Test the agent while you build it.</div>';
  if (!st.try) h += '<div class="chips"><span class="chip" data-hot="try-prompt">What\'s on my first-week checklist?</span><span class="chip">How do I request my laptop?</span></div>';
  else h += '<div class="msg u">What\'s on my first-week checklist?</div><div class="msg a"><b>Your first week</b><ol style="margin:6px 0;padding-inline-start:18px"><li>Collect your laptop and badge</li><li>Complete security training</li><li>Meet your onboarding buddy</li></ol>Sources: <span class="cite" data-hot="try-cite">1 HR-Onboarding</span><span class="cite">2 First-week-checklist.docx</span><div class="muted" style="margin-top:6px">Simulated answer</div></div>';
  return mapp(lp(st, "agents"), h + '<div class="cbox"><span class="ph">Message Onboarding Buddy</span></div>');
};
S["cp-agent"] = function(st){
