li>\n<\/ul>","src":["cs-teams","cs-publish-std"]},{"type":"diagram","svg":"a7","title":"Architecture: publish and distribution paths","caption":"Agent Builder agents move from private, to shared, to an admin-approved org catalog entry. Copilot Studio agents publish versions to channels, then reach users through sharing or admin approval. Data policies and Agent 365 provide the governance layer.","src":["ab-share","ab-catalog","cs-publish","cs-teams","cs-publish-std","agent365"]},{"type":"card","title":"Who governs what?","kicker":"Admins","aside":{"img":"kubo","say":"Every agent needs an owner, even me!"},"body":"\n<ul>\n<li><b>Agent Builder<\/b> agents are managed in the <b>Microsoft 365 admin center<\/b>.<\/li>\n<li><b>Copilot Studio<\/b> agents are managed in the <b>Power Platform admin center<\/b>: environments, data policies, connector policies and sharing limits. Agents copied to Copilot Studio are stored in Dataverse and managed through a solution.<\/li>\n<li>Publishing a Copilot Studio agent to Microsoft 365 <b>doesn't remove<\/b> the applicable Microsoft 365 controls.<\/li>\n<li><b>Microsoft Agent 365<\/b> provides an <b>agent registry<\/b> in the Microsoft 365 admin center covering agents from Microsoft, partners and your own teams. It shows risk signals from Defender, Entra and Purview, and Copilot Credit cost management. It is licensed per user.<\/li>\n<\/ul>","src":["ab-copy","ab-vs-cs","agent365"]},{"type":"villain","v":"oni","title":"Villain alert: Oversharing Oni is back","attack":"Share the agent with everyone and embed the salary spreadsheet. What could go wrong?","counter":["Embedded files: anyone who has access to the agent also has access to the information in those files.","Prefer governed sources (such as SharePoint sites) that the intended audience can access.","If the agent uses personal Work IQ sources (Teams meetings, chats, email), say so in the short description.","Shared SharePoint knowledge still respects each user's permissions: users without access to a file get no answers from it."],"src":["ab-knowledge","ab-catalog","ab-share"]},{"type":"quiz","title":"Checkpoint 6","qs":[{"q":"Your Agent Builder agent is approved in the org catalog. You change it and select Update. What do Agent Store users see?","opts":["The new version immediately","The last approved version, until you resubmit and an admin approves","Nothing: the agent is removed","A blank agent"],"a":1,"why":"Update changes the shared version right away. The Agent Store version changes only after an approved resubmission.","src":"ab-catalog"},{"q":"Which channel is NOT currently available for agents on the Microsoft Copilot harness?","opts":["Microsoft Teams","SharePoint","Microsoft Copilot","Demo website"],"a":1,"why":"The channel list shows SharePoint as not available for this harness.","src":"cs-channels"},{"q":"You published a Copilot Studio agent and keep editing it. When do users see the edits?","opts":["Instantly","After you publish again","Automatically the next day","Never"],"a":1,"why":"Draft changes stay in draft until you publish again.","src":"cs-publish-overview"}]}]},{"id":"c7","num":"Chapter 7","title":"Connect MCP and agent to agent (A2A)","short":"Connect MCP and A2A","dur":"30 min","goal":"Give the agent tools over MCP, delegate to another agent over A2A, and keep both governed.","pages":[{"type":"scene","img":"p-ch7-mcp","kb":"kb-a","caption":"The server hall. Orbi meets the Contoso HR MCP server. Nova, over the speaker: \"Tool names and descriptions come from the server. If they're vague, fix them there.\"","bubbles":[{"who":"sari","t":"One plug, and Orbi can see every tool the server exposes.","x":18,"y":1,"w":24,"tail":"b10"},{"who":"orbi","t":"Handshake done! Tools listed: search, calendar, records...","x":24,"y":70,"w":27,"tail":"t80"}],"fx":["sparkle","pulse:74,46","glow:74,46"],"src":["cs-mcp-tool","cs-mcp-std"]},{"type":"steps","title":"Add an MCP server to the agent","cols":[{"head":"Microsoft Copilot harness (preview)","steps":["<b>Build<\/b> tab &gt; <b>Tools<\/b> &gt; <b>Add tool<\/b>.","<b>Gallery:<\/b> the <b>MCP<\/b> tab lists servers already published for your organization, such as Microsoft 365 services, Foundry IQ and Fabric IQ. First-party servers (for example Mail) connect with your signed-in identity; others ask you to create a connection.","<b>Custom server:<\/b> Add &gt; <b>Model Context Protocol (MCP)<\/b> &gt; Name, Description, Server URL (HTTPS), Authentication &gt; <b>Add<\/b>.","Copilot Studio performs the protocol handshake and lists the server's tools. Check each name and description, then select <b>Save<\/b>.","Test in <b>Preview<\/b>, then open the activity trace to see the tool, its arguments and its result."]},{"head":"Standard harness","steps":["<b>Tools<\/b> page &gt; <b>Add a tool<\/b> &gt; <b>New tool<\/b> &gt; <b>Model Context Protocol<\/b> (onboarding wizard).","Enter Server name, Server description and Server URL. The orchestrator uses the description to decide when to call the server.","Authentication: <b>None<\/b>, <b>API key<\/b> (header or query) or <b>OAuth 2.0<\/b> (Dynamic discovery, Dynamic or Manual).","Create or choose a connection, then select <b>Add to agent<\/b>.","Requirements: generative orchestration on; Streamable transport only."]}],"src":["cs-mcp-tool","cs-mcp-existing","cs-mcp-std"]},{"type":"card","title":"Running your own MCP server","kicker":"Build and operate","aside":{"img":"kubo","say":"Reusing someone's server doesn't make them your on-call team."},"body":"\n<ul>\n<li>Build with the <b>MCP SDKs<\/b>. For auth, use an <b>API key<\/b> or <b>OAuth 2.0<\/b>; with OAuth, register the callback URL that Copilot Studio gives you with your identity provider.<\/li>\n<li>Expose only the tools you need, with clear names, descriptions, inputs, outputs, errors and safety annotations. Apply least privilege.<\/li>\n<li>Operate it: hosting, networking, secrets, logging, monitoring, scaling, incident response and versioning. Reusing a server doesn't transfer the responsibility for operating it.<\/li>\n<li>For <b>Cowork<\/b> connectors: HTTPS (TLS 1.2+), Streamable HTTP, JSON-RPC 2.0, <code>tools/list<\/code> and <code>tools/call<\/code>, and under 30 seconds per tool call. Tools with <code>readOnlyHint=false<\/code> or <code>destructiveHint=true<\/code> require confirmation; tools with no annotations are treated as destructive.<\/li>\n<li>GitHub Copilot can help write the server code, schemas and tests, but it doesn't provide the MCP runtime, hosting, authentication or the Microsoft 365 connection.<\/li>\n<\/ul>","src":["cs-mcp-new","mcp-m365","cowork-plugins"]},{"type":"diagram","svg":"a8","title":"Architecture: MCP in Copilot Studio","caption":"The agent discovers tools (tools/list) and calls them (tools/call) over Streamable HTTP through Power Platform connector infrastructure, so data policies apply. Authentication uses an API key or OAuth 2.0 with your app registration. Hosting is your choice; Azure Container Apps is shown only as an example.","src":["cs-mcp-existing","cs-mcp-tool","mcp-m365","cs-mcp-new"]},{"type":"card","title":"MCP governance and limits","kicker":"Learn says","aside":{"img":"nova","say":"Fewer, sharper servers beat many vague ones."},"body":"\n<ul>\n<li>MCP access in Copilot Studio uses <b>Power Platform connectors<\/b>, so a data policy that regulates connectors also regulates the MCP server and its tools.<\/li>\n<li>The number of MCP server instances that can run at the same time in one conversation is <b>capped<\/b>, and each server counts toward the agent's tool limit. Keep the list small.<\/li>\n<li>When you connect to a non-Microsoft MCP server, you're responsible for the tools and resources you access.<\/li>\n<li>Copilot Studio reflects tool changes on the server automatically (standard harness). On the Microsoft Copilot harness, edit the server entry to refresh the tool list.<\/li>\n<li>Bring-your-own MCP servers can also be registered in <b>Agent 365<\/b> through the Agent 365 CLI and the Microsoft 365 admin center (preview). Learn lists the supported clients as Copilot Studio, VS Code, Claude Code and GitHub Copilot CLI; Microsoft 365 declarative agents aren't supported on this route.<\/li>\n<\/ul>","src":["cs-mcp-existing","cs-mcp-tool","cs-mcp-std","mcp-m365"]},{"type":"scene","img":"p-ch7-a2a","kb":"kb-b","caption":"The bridge. Kubo is Contoso's IT Provisioning agent, built on another framework and hosted outside Copilot Studio.","bubbles":[{"who":"kubo","t":"Here's my agent card: who I am, what I do, where to reach me.","x":58,"y":2,"w":26,"tail":"b25"},{"who":"orbi","t":"Nice to meet you! Can you set up a laptop for our new hire?","x":18,"y":2,"w":26,"tail":"b80"},{"who":"sari","t":"That's A2A: Orbi delegates the task. It doesn't just call an API.","x":2,"y":58,"w":27,"tail":"t40"}],"fx":["sparkle","flow:28,43,50,43","flow:72,43,50,43"],"src":["cs-a2a","cs-a2a-std"]},{"type":"steps","title":"Add an A2A agent as a connected agent","cols":[{"head":"Microsoft Copilot harness","steps":["<b>Build<\/b> tab &gt; <b>Connected agents<\/b> &gt; <b>Add<\/b> &gt; <b>Add A2A agent<\/b>.","<b>Agent card URL<\/b> (typically https://&lt;host&gt;/.well-known/agent-card.json). Copilot Studio reads it to discover the endpoint and capabilities, and fills in the name and description when the card has them. Description: 30 to 1,000 characters.","Authentication: <b>None<\/b>, <b>API key<\/b> (header or query string; the key value goes on the connection) or <b>OAuth 2.0<\/b> (Dynamic or Manual). With OAuth, register the generated <b>redirect URL<\/b> in your app registration first.","Choose or create the connection &gt; <b>Review and add<\/b> &gt; <b>Add to agent<\/b>.","Test in <b>Preview<\/b>: a message in Kubo's domain should route to Kubo; a message outside it should stay with your agent."]},{"head":"Standard harness","steps":["Agents page &gt; <b>Add agent<\/b> &gt; <b>A2A agent<\/b>.","Enter the agent's <b>endpoint URL<\/b> (not the card URL). The name and description are pulled from the card at /.well-known/agent.json when available.","Authentication: None, API key or OAuth 2.0 &gt; <b>Save<\/b> &gt; pick or create a connection &gt; <b>Add and configure<\/b>.","Each A2A message carries metadata such as a contextId, message IDs, locale and the full chat history.","A2A uses the custom connector infrastructure, so it can also reach agents on-premises or in a virtual network."]}],"src":["cs-a2a","cs-a2a-std"]},{"type":"diagram","svg":"a9","title":"Architecture: agent-to-agent delegation","caption":"(1) Copilot Studio reads the remote agent's card. (2) The orchestrator decides to delegate and sends a task with context. (3) The remote agent replies, and the primary agent answers the user. Learn's sample runs locally, uses Azure OpenAI and is exposed with Dev Tunnels; for production, host it securely (for example Azure App Service or a container) with authentication.","src":["cs-a2a","cs-a2a-std","cs-connected"]},{"type":"card","title":"Connected-agent rules of the road","kicker":"Design notes","aside":{"img":"orbi","say":"One hop only. Kubo can't call another connected agent."},"body":"\n<ul>\n<li><b>Routing<\/b> uses the connected agent's name and description, the user's message and context, and your primary agent's instructions.<\/li>\n<li>The orchestrator writes the task description and can rephrase or expand the request, so <b>don't rely on the prompt being forwarded word for word<\/b>.<\/li>\n<li><b>One level only<\/b> (Microsoft Copilot harness): a connected agent can't invoke another connected agent. Handoffs have a payload limit, so return compact, structured data.<\/li>\n<li><b>When to split:<\/b> when selection degrades (rule of thumb: more than 30-40 tools, topics and agents), when different teams, settings or ALM processes apply, or for reuse. The cost is extra latency and a larger testing and governance surface.<\/li>\n<li><b>Security:<\/b> a connected agent may have privileges the parent doesn't. Treat the call like any powerful action, and log it.<\/li>\n<li>You're responsible for external agents: data flows, quality, permissions, observability and human oversight.<\/li>\n<\/ul>","src":["cs-connected","cs-a2a","cs-add-other-agents","cs-multi-agent"]},{"type":"card","title":"Flip it around: expose your own agent","kicker":"Preview","aside":{"img":"kubo","say":"Then other agents can call Orbi too!"},"body":"\n<ul>\n<li>On the Microsoft Copilot harness, the <b>MCP client<\/b> channel exposes your agent as a remote MCP server, and the <b>A2A client<\/b> channel exposes it to other agents over A2A.<\/li>\n<li>Both are in <b>preview<\/b> and only available in early-release environments.<\/li>\n<li>Work IQ also offers <b>A2A<\/b> and <b>MCP<\/b> endpoints for Microsoft 365 context (usage-based billing).<\/li>\n<\/ul>","src":["cs-channels","workiq"]},{"type":"quiz","title":"Checkpoint 7","qs":[{"q":"Which MCP transport does Copilot Studio support?","opts":["SSE","Streamable","WebSocket only","stdio"],"a":1,"why":"Copilot Studio supports the Streamable transport. SSE support ended after August 2025.","src":"cs-mcp-existing"},{"q":"On the Microsoft Copilot harness, where does Copilot Studio discover an A2A agent's endpoint and capabilities?","opts":["The Teams app manifest","Its agent card URL","A SharePoint list","A Dataverse table"],"a":1,"why":"You enter the agent card URL, and Copilot Studio reads the card.","src":"cs-a2a"},{"q":"Can a connected agent invoke another connected agent (Microsoft Copilot harness)?","opts":["Yes, without limit","Yes, up to three levels","No: delegation supports one level only","Only over A2A"],"a":2,"why":"Connected-agent delegation only supports one level.","src":"cs-connected"}]}]},{"id":"c8","num":"Chapter 8","title":"Cowork and Code","short":"Cowork and Code","dur":"25 min","goal":"Let Copilot do work for you with approvals (Cowork), build small tools in plain language (Code), and know the pro-code routes.","pages":[{"type":"scene","img":"p-ch8-cowork","kb":"kb-c","caption":"Dewi: \"Cowork, prepare the welcome-session deck, email it to the new-hire group and book the session.\"","bubbles":[{"who":"orbi","t":"It paused before sending, and shows exactly what it will send. You stay in control.","x":47,"y":1,"w":32,"tail":"l60"}],"fx":["sparkle","pulse:63,52","glow:63,52"],"src":["cowork-start","cowork-overview"]},{"type":"card","title":"What Copilot Cowork does","kicker":"Learn says","aside":{"img":"sari","say":"It asks before it sends. I like that."},"body":"\n<ul>\n<li>Carries out tasks <b>on your behalf<\/b> across Microsoft 365: drafts and sends email, schedules meetings, creates Word, Excel, PowerPoint and PDF files, posts in Teams, searches your organization, manages OneDrive and SharePoint files, runs deep research, and runs scheduled or event-driven tasks.<\/li>\n<li><b>You approve actions before they happen<\/b>, with a risk indicator for medium- and high-risk actions. You can pause, resume or cancel at any time.<\/li>\n<li>Uses <b>built-in skills<\/b> plus your <b>custom skills<\/b> (up to 50) and <b>plugins<\/b> from the Microsoft 365 App Store, which add skills and connectors.<\/li>\n<li>Available at copilot.cloud.microsoft, in Outlook and Teams, in the Microsoft Copilot desktop app (Windows, macOS) and on mobile.<\/li>\n<li>Prerequisites: a Microsoft 365 Copilot license, Cowork enabled, and usage-based billing enabled. The App skill requires Frontier. Cowork for work or school accounts is generally available.<\/li>\n<\/ul>","src":["cowork-overview","cowork-start","m365-overview"]},{"type":"card","title":"Extend Cowork with plugins","kicker":"Skills + connectors","aside":{"img":"kubo","say":"A plugin can bundle skills AND an MCP connector."},"body":"\n<ul>\n<li>A Cowork <b>plugin<\/b> is a Microsoft 365 app package (.zip): <code>manifest.json<\/code>, icons, a <code>skills/<\/code> folder of SKILL.md files, and optional <b>connectors<\/b>, which are remote MCP servers.<\/li>\n<li>Build it with the <b>wiqd CLI<\/b> (preview): create, add skills and connectors, validate, provision, package, share.<\/li>\n<li>Have a Claude Code plugin already? Import it (<code>wiqd plugin import<\/code>) or convert it with <code>atk import openplugin<\/code>.<\/li>\n<li>Distribution: share with specific users (they see it under Shared with me), upload through the Microsoft 365 admin center (Discover), or submit to the public store through Partner Center.<\/li>\n<li>Manage everything on Cowork's <b>Customize<\/b> page: Preferences (custom instructions up to 20 KB), Plugins and Skills.<\/li>\n<\/ul>","src":["cowork-plugins","cowork-customize"]},{"type":"code","title":"The wiqd plugin lifecycle (commands from Learn)","lang":"shell","code":"wiqd auth login --interactive\nwiqd plugin create --name contoso-onboarding\nwiqd plugin add skill --name \"New hire welcome pack\"\nwiqd plugin add connector --name \"Contoso HR\" \\\n     --description \"HR records over MCP\" \\\n     --url https://hr.contoso.com/mcp\nwiqd plugin validate --mode deep\nwiqd plugin provision\nwiqd plugin package\nwiqd plugin share --scope users --email dewi@contoso.com","notes":["Command names come from Learn's 'Build plugins for Copilot Cowork' article. The plugin name, skill name, URL and email are our Contoso placeholders.","Work IQ Dev Tools (wiqd) is in preview and the wiqd plugin command tree is alpha, so commands and output can change.","Run provision first, because it writes the environment file that package and share depend on."],"src":["cowork-plugins","dev-tools"]},{"type":"scene","img":"p-ch8-code","kb":"kb-a","caption":"Evening. Dewi prototypes an onboarding progress dashboard in Copilot Code.","bubbles":[{"who":"sari","t":"Show tasks completed per new hire, by week, as a bar chart.","x":1,"y":1,"w":22,"tail":"b70"},{"who":"nova","t":"Nice. When it's ready, Code can open a draft pull request in GitHub.","x":50,"y":52,"w":26,"tail":"r20"}],"fx":["sparkle","glow:43,25"],"src":["code-overview"]},{"type":"card","title":"Copilot Code (Frontier)","kicker":"Learn says","aside":{"img":"orbi","say":"Frontier means preview. Great for prototypes!"},"body":"\n<ul>\n<li>The <b>Code tab<\/b> in Microsoft Copilot, next to Chat and Cowork, turns plain-language descriptions into working software: apps, dashboards, internal tools, static websites, data transforms and scripts.<\/li>\n<li>A <b>live preview canvas<\/b> and a <b>code view<\/b>. Select an element on the canvas to target your next change, and revert to earlier versions.<\/li>\n<li>Runs <b>locally<\/b> (a project folder on your device) or in the <b>cloud<\/b> (an isolated environment, good for sharing).<\/li>\n<li><b>GitHub:<\/b> clone repositories, ask questions, create branches, commits and draft pull requests, and create new repositories.<\/li>\n<li>Asks permission before network calls, extensions or MCP, terminal commands, and files outside the project. Admins can audit its actions.<\/li>\n<li>Uses the same plugins as Cowork. Available in the Microsoft Copilot desktop app for Windows and in the cloud on the web. Part of the Frontier preview.<\/li>\n<\/ul>","src":["code-overview"]},{"type":"diagram","svg":"a10","title":"Architecture: Chat, Cowork and Code in Microsoft Copilot","caption":"Three tabs, one Work IQ context (with your permission). Cowork runs tasks with skills, plugins and approvals. Code builds software locally or in the cloud, connects to GitHub and uses the same plugins. MCP connectors extend both.","src":["cowork-overview","code-overview","cowork-plugins","m365-overview"]},{"type":"table","title":"Pro-code routes for agents (per Learn)","headers":["You are...","Start with"],"rows":[["A no-code builder","Agent Builder"],["A low-code maker who needs workflows and Power Platform integration","Copilot Studio"],["A pro-code developer of declarative agents (source control, terminal, CI)","Work IQ Dev Tools (preview)"],["A pro-code developer who needs lower-level manifest and package control","Microsoft 365 Agents Toolkit"],["Building a custom engine agent","Microsoft 365 Agents SDK (or another supported custom-engine stack)"],["Managing Copilot Studio agents as code","Copilot Studio extension for VS Code (YAML, Git, pull requests)"],["A GitHub Copilot user","GitHub Copilot assists the chosen route; it doesn't own the package, publishing or runtime"]],"src":["dev-tools","cs-vscode"]},{"type":"quiz","title":"Checkpoint 8","qs":[{"q":"What does Cowork do before sending an email on your behalf?","opts":["Sends it immediately","Asks for your approval","Sends it to your manager first","Nothing special"],"a":1,"why":"Before sending an email, posting or scheduling, Cowork asks for your permission.","src":"cowork-start"},{"q":"How many custom skills can you create in Cowork?","opts":["Up to 8","Up to 50","Up to 5","Unlimited"],"a":1,"why":"The Cowork overview says you can create up to 50 custom skills.","src":"cowork-overview"},{"q":"Which GitHub action is documented for Copilot Code?","opts":["Creating branches, commits and draft pull requests","Merging to production automatically","Deleting repositories without asking","Changing org billing"],"a":0,"why":"Learn lists cloning, questions, branches, commits, draft pull requests and creating repositories.","src":"code-overview"}]}]},{"id":"c9","num":"Chapter 9","title":"Microsoft 365 Copilot or Copilot Studio: when and why","short":"When and why","dur":"20 min","goal":"Choose the right tool from requirements, without bias, using Learn's decision guide.","pages":[{"type":"scene","img":"p-ch9-crossroads","kb":"kb-c","caption":"The crossroads. A cozy workshop on the left, a big studio campus on the right.","bubbles":[{"who":"sari","t":"So which path is better: Agent Builder or Copilot Studio?","x":52,"y":46,"w":26,"tail":"l30"},{"who":"nova","t":"Neither by default. Choose by the capabilities and operating model you need, not by audience size alone.","x":17,"y":1,"w":29,"tail":"b45"},{"who":"orbi","t":"Start simple. Grow when you need to!","x":62,"y":2,"w":22,"tail":"l70"}],"fx":["sparkle"],"src":["ab-vs-cs"]},{"type":"card","title":"Learn's decision guide: three questions","kicker":"Choose a starting point","aside":{"img":"nova","say":"More departments doesn't automatically mean Copilot Studio."},"body":"\n<ol>\n<li><b>Do users need an external channel<\/b>, such as a customer-facing website? Evaluate <b>Copilot Studio<\/b>, and confirm the chosen harness supports that channel and authentication.<\/li>\n<li><b>Do you need external-service actions, workflow logic, or separate development, test and production environments?<\/b> Evaluate <b>Copilot Studio<\/b>'s tools, workflows and lifecycle features.<\/li>\n<li><b>Can instructions plus the supported knowledge and capabilities in Microsoft 365 Copilot meet the need?<\/b> Start with <b>Agent Builder<\/b>. It supports sharing and submission to your org catalog.<\/li>\n<\/ol>\n<ul>\n<li>Learn: needing users across several departments <b>doesn't by itself<\/b> require Copilot Studio.<\/li>\n<li>You can <b>copy<\/b> an Agent Builder agent to Copilot Studio later. It's a snapshot, not a sync. Connectors, embedded files, and Teams or email knowledge need reconfiguring, and image generation isn't supported there.<\/li>\n<\/ul>","src":["ab-vs-cs","ab-copy"]},{"type":"table","title":"Agent Builder vs Copilot Studio (Learn's comparison)","headers":["","Agent Builder (Microsoft 365 Copilot)","Copilot Studio"],"rows":[["Authoring approach","Guided natural-language configuration, no source-code project","Managed authoring with the logic, tools and workflows the selected harness supports"],["Knowledge and capabilities","Supported Microsoft 365 knowledge sources and built-in capabilities; custom skills in preview","Knowledge, tools, connectors and other capabilities of the selected experience"],["External actions","Can't author actions that integrate external services (copy to Copilot Studio or use pro-code)","Integrations and business workflows through tools and connectors"],["Audience and distribution","Users in your organization, through sharing and org-catalog publishing","Internal or external users, through the channels the selected harness supports"],["Lifecycle","Configure, test, share, submit for org publication","Environments, ALM, deployment and analytics"],["Governance","Microsoft 365 agent controls plus data-source permissions and policies","Power Platform environment and connector controls, plus Microsoft 365 agent and channel controls"],["Example fit","An onboarding or project-information agent grounded in approved content","An IT request workflow with approvals; customer support with service integration and escalation"]],"src":["ab-vs-cs"]},{"type":"diagram","svg":"a11","title":"Architecture: decision flow","caption":"Follow the questions from the top. Copilot Cowork and Copilot Code aren't agent-building tools: they're experiences in Microsoft Copilot for doing work and building small apps.","src":["ab-vs-cs","cs-harnesses","cs-choose-harness","agents-compare","cowork-overview","code-overview"]},{"type":"card","title":"Why: the honest trade-offs","kicker":"No bias","aside":{"img":"orbi","say":"Every tool has limits. Learn lists them, so we do too."},"body":"\n<div class=\"two\">\n<div><h4>Agent Builder<\/h4><ul>\n<li>+ Fastest path, inside Microsoft Copilot and Teams<\/li>\n<li>+ Declarative agents use Copilot's orchestrator and models and inherit Microsoft 365 compliance and RAI standards<\/li>\n<li>+ Doesn't consume the tenant's Dataverse storage<\/li>\n<li>&minus; Can't author external-service actions<\/li>\n<li>&minus; Can prioritize your sources but not block general knowledge<\/li>\n<li>&minus; Not usable in Teams group or 1:1 chats; customer-managed keys not supported<\/li><\/ul><\/div>\n<div><h4>Copilot Studio<\/h4><ul>\n<li>+ Tools, connectors, MCP, A2A, workflows and three harnesses<\/li>\n<li>+ Internal or external channels, environments, ALM and analytics<\/li>\n<li>+ Power Platform governance on top of Microsoft 365 controls<\/li>\n<li>&minus; More to set up and govern (environments, Dataverse, policies)<\/li>\n<li>&minus; Billing depends on the harness; the Microsoft Copilot harness consumes credits from build time<\/li>\n<li>&minus; Check harness feature and channel gaps before you commit<\/li><\/ul><\/div>\n<\/div>","src":["ab-overview","ab-knowledge","agents-compare","ab-vs-cs","ab-copy","cs-billing","cs-harness-overview"]},{"type":"card","title":"Contoso's decision (our example)","kicker":"Apply it","aside":{"img":"sari","say":"Right tool, right job. Not one tool for everything."},"body":"\n<ul>\n<li><b>Onboarding Buddy v1<\/b> (FAQ and checklist from the HR SharePoint site, used in Microsoft Copilot) &rarr; <b>Agent Builder<\/b>. This matches Learn's own example fit.<\/li>\n<li><b>Onboarding Orchestrator v2<\/b> (IT requests with approvals, the HR MCP server, an A2A hand-off to Kubo, document creation) &rarr; <b>Copilot Studio<\/b>.\n <ul><li>Bounded, predictable flow &rarr; <b>standard harness<\/b> (like Learn's HR intake example).<\/li>\n <li>Long, multi-step reasoning with files &rarr; <b>Microsoft Copilot harness<\/b> (like Learn's accounts-payable example).<\/li><\/ul><\/li>\n<li><b>Dewi's own tasks<\/b> (decks, emails, scheduling) &rarr; <b>Copilot Cowork<\/b>. A quick progress dashboard &rarr; <b>Copilot Code<\/b> (Frontier).<\/li>\n<\/ul>\n<p class=\"note\">This mapping is our worked example, built from Learn's decision factors. Validate licensing, features and channels in your own tenant.<\/p>","src":["ab-vs-cs","cs-choose-harness","cowork-overview","code-overview"]},{"type":"quiz","title":"Final checkpoint","qs":[{"q":"Users in several departments need an onboarding FAQ agent grounded in approved SharePoint content. Does that alone require Copilot Studio?","opts":["Yes, always","No: start with Agent Builder if its capabilities fit","Only above 500 users","Only in Teams"],"a":1,"why":"Learn: needing users across several departments doesn't by itself require Copilot Studio.","src":"ab-vs-cs"},{"q":"You need a customer-facing website chat with service integration and escalation. Where do you start evaluating?","opts":["Agent Builder","Copilot Studio, checking the harness's channel and authentication support","Copilot Cowork","Copilot Code"],"a":1,"why":"External channels point to Copilot Studio. The Customer Conversation harness targets customer-facing chat and voice.","src":"ab-vs-cs"},{"q":"What happens when you copy an Agent Builder agent to Copilot Studio?","opts":["Both stay synced","A separate snapshot is created, and some sources need reconfiguring","The original agent is deleted","Nothing is copied"],"a":1,"why":"The copy is a snapshot. Updates to the original don't affect it, and some configurations aren't copied.","src":"ab-copy"},{"q":"Which statement about the standard and Microsoft Copilot harnesses comes from Learn?","opts":["The Microsoft Copilot harness is always better","The standard harness is deprecated","Neither is universally better; it depends on the business process","They're billed the same way"],"a":2,"why":"Learn's harness guidance says neither is universally better.","src":"cs-choose-harness"},{"q":"Which tool owns packaging and publishing of a Microsoft 365 agent?","opts":["GitHub Copilot","The selected authoring route (for example Agent Builder, Agents Toolkit or Copilot Studio)","Any browser","Copilot Code"],"a":1,"why":"GitHub Copilot assists, but another tool owns the package, validation, publishing and governance route.","src":"dev-tools"}]}]},{"id":"c10","num":"Epilogue","title":"Graduation","dur":"5 min","goal":"Celebrate, recap and keep learning.","pages":[{"type":"scene","img":"p-epilogue","kb":"kb-b","caption":"The team celebrates. Onboarding Buddy is live, and Dewi earns her first star.","bubbles":[{"who":"nova","t":"Graduation! Next mission: help the next new hire, with Onboarding Buddy.","x":10,"y":1,"w":28,"tail":"r70"},{"who":"sari","t":"And every answer still links to its source!","x":1,"y":64,"w":22,"tail":"t95"},{"who":"kubo","t":"Beep! Laptop provisioned!","x":79,"y":31,"w":20,"tail":"b20"}],"fx":["confetti","sparkle"],"src":[]},{"type":"recap","title":"What Dewi learned","items":[["1","Two products (Microsoft 365 Copilot, Copilot Studio) and two open protocols (MCP, A2A)."],["2","Copilot grounds prompts with Microsoft Graph and Work IQ, within each user's permissions."],["3","Copilot Studio runs on a harness: Microsoft Copilot (also called GitHub Copilot in some Learn pages), Customer Conversation or standard."],["4","Agent Builder for fast declarative agents; Copilot Studio for tools, workflows, channels and ALM."],["5","Skills package repeatable know-how (SKILL.md) for Agent Builder, Copilot Studio and Cowork."],["6","Publishing is a path: share, then catalog with admin approval, or publish versions to channels."],["7","MCP adds tools; A2A delegates tasks to other agents. Both are governed."],["8","Cowork does work with your approval; Code builds software in plain language (Frontier)."],["9","Choose by capabilities and operating model, not audience size alone."]],"links":[["Try the click-through demos","demo.html"],["All Microsoft Learn sources","#/sources"]]}]}],"sources":{"m365-overview":["Microsoft Copilot overview (What is Microsoft Copilot?)","https://learn.microsoft.com/en-us/microsoft-365/copilot/copilot-overview","2026-10-28"],"m365-arch":["Microsoft Copilot architecture and how it works","https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-architecture","2026-09-14"],"m365-privacy":["Data, Privacy, and Security for Microsoft Copilot","https://learn.microsoft.com/en-us/microsoft-365/copilot/microsoft-365-copilot-privacy","2026-08-18"],"agents-compare":["Compare declarative and custom engine agents","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agents-overview","2026-09-30"],"da-overview":["Declarative agents for Microsoft 365 Copilot","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/overview-declarative-agent","2026-10-27"],"workiq":["Work IQ overview","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/work-iq/","2026-11-05"],"dev-tools":["Choose development tools for your plugin","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/choose-plugin-development-tools","2026-11-12"],"mcp-m365":["Build or reuse MCP servers for a Microsoft 365 Copilot plugin","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/build-reuse-mcp-servers","2026-10-28"],"ab-overview":["Agent Builder overview","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder","2026-10-27"],"ab-build":["Build agents in Agent Builder","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder-build-agents","2026-10-26"],"ab-knowledge":["Add knowledge sources to an agent in Agent Builder","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder-add-knowledge","2026-09-30"],"ab-skills":["Add skills to your declarative agent in Agent Builder","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder-add-skills","2026-11-11"],"da-skills":["Skills in declarative agents","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/declarative-agent-skills","2026-11-11"],"ab-share":["Share and manage agents built in Agent Builder","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder-share-manage-agents","2026-11-06"],"ab-catalog":["Submit agents from Agent Builder to your org catalog","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-builder-submit-to-org-catalog","2026-09-30"],"ab-copy":["Copy an agent from Agent Builder to Copilot Studio","https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/copy-agent-to-copilot-studio","2026-09-30"],"ab-vs-cs":["Choose be ref=\"#g-code\" x=\"730\" y=\"430.0\" width=\"30\" height=\"30\"/><text class=\"nt big\" x=\"772\" y=\"442.0\">Custom engine agent<\/text><text class=\"ns\" x=\"772\" y=\"459.0\">Pro-code: Microsoft 365 Agents<\/text><text class=\"ns\" x=\"772\" y=\"473.0\">SDK; you host it and own<\/text><text class=\"ns\" x=\"772\" y=\"487.0\">compliance<\/text><\/g><path class=\"eg flow3 \" d=\"M640.0 448.0 L650.0 448.0 Q660.0 448.0 660.0 458.0 L660.0 460.0 Q660.0 470.0 670.0 470.0 L720.0 470.0\" marker-end=\"url(#a11-ar)\" data-k=\"y4\"/><circle class=\"dt flow3\" r=\"4.2\" data-k=\"y4\"><animateMotion dur=\"1.6s\" repeatCount=\"indefinite\" path=\"M640.0 448.0 L650.0 448.0 Q660.0 448.0 660.0 458.0 L660.0 460.0 Q660.0 470.0 670.0 470.0 L720.0 470.0\"/><\/circle><g class=\"el\" data-k=\"y4\"><rect x=\"675.5\" y=\"476.0\" width=\"28.9\" height=\"20\" rx=\"10\"/><text x=\"690.0\" y=\"490.0\">yes<\/text><\/g><g class=\"nd k-gov pop\" style=\"animation-delay:0.72s\" tabindex=\"0\" data-k=\"na\"><rect x=\"30\" y=\"430\" width=\"300\" height=\"96\" rx=\"12\"/><use class=\"gl\" href=\"#g-spark\" x=\"40\" y=\"440.0\" width=\"30\" height=\"30\"/><text class=\"nt\" x=\"82\" y=\"452.0\">Not building an agent?<\/text><text class=\"ns\" x=\"82\" y=\"469.0\">Do work for yourself: Copilot Cowork.<\/text><text class=\"ns\" x=\"82\" y=\"483.0\">Build a small app: Copilot Code<\/text><text class=\"ns\" x=\"82\" y=\"497.0\">(Frontier).<\/text><\/g><text class=\"gt2\" x=\"30\" y=\"60\" text-anchor=\"start\">Audience size alone doesn&#x27;t decide.<\/text><\/svg>"},"flows":{"a1":[{"e":["e_use"],"n":["people","app"],"t":"People use Microsoft Copilot and Teams: chat, Cowork, Code and agents."},{"e":["e_wiq"],"n":["wiq","orch"],"t":"The Copilot orchestrator grounds answers in Microsoft Graph and Work IQ, scoped to each user's permissions."},{"e":["e_act"],"n":["decl","mcp"],"t":"Declarative agents can add MCP-based actions, built with Agents Toolkit or Work IQ Dev Tools."},{"n":["harness","know","tools"],"t":"Copilot Studio agents run on a harness (Microsoft Copilot, Customer Conversation or standard) with knowledge, skills and workflows, plus model, memory and hooks."},{"e":["e_mcp","e_a2a"],"n":["tools","mcp","a2a"],"t":"Tools and connected agents reach MCP servers, and A2A agents built on other frameworks and hosts."},{"e":["e_pub"],"n":["chan","app"],"t":"Copilot Studio publishes agents to Teams and Microsoft Copilot through its channels."},{"h":["e_g1","e_g2"],"n":["mac","ppac"],"t":"Admins govern both: the Microsoft 365 admin center (Agent Builder controls, org catalog approval, Agent 365 agent registry) and the Power Platform admin center (environments, data policies, Copilot Credits)."}],"a2":[{"e":["e1"],"n":["user","cop"],"b":["b1"],"tag":"prompt","t":"You enter a prompt in a Microsoft 365 app, such as Word, Teams, Outlook or Microsoft Copilot."},{"n":["cop"],"b":["b2"],"t":"Copilot pre-processes the prompt before grounding it."},{"e":["e2","e3"],"seq":true,"tags":{"e2":"ground","e3":"context"},"n":["cop","graph"],"b":["b3"],"t":"Grounding: Copilot gets context from Microsoft Graph (emails, chats, files, meetings), only what this user is allowed to access."},{"e":["e4","e5"],"seq":true,"tags":{"e4":"grounded prompt","e5":"response"},"n":["cop","llm"],"b":["b4"],"t":"Copilot sends the grounded prompt to the large language model, which generates a contextually relevant response."},{"e":["e6"],"n":["cop","user"],"b":["b5"],"tag":"response","t":"Copilot returns the response to the app."},{"n":["g1","g2","g3","g4"],"t":"Throughout: data is encrypted in transit, Conditional Access and MFA are honored, prompts, responses and Graph data aren't used to train foundation LLMs, and chat history is stored so admins can search and retain it with Purview."}],"a3":[{"n":["ins","kn","act","bd"],"t":"Declarative agent: you supply instructions, knowledge and actions (skills, MCP tools). Build it with Agent Builder, Agents Toolkit or Work IQ Dev Tools."},{"e":["d1"],"n":["orch"],"t":"Copilot's orchestrator and foundation models run it on Microsoft 365 infrastructure: no extra hosting."},{"e":["d2"],"n":["runs","inh"],"t":"It runs in Microsoft 365 Copilot and apps, and inherits Microsoft 365 compliance, security and RAI."},{"e":["c1"],"n":["yo","ym","ka","cbw"],"t":"Custom engine agent: your own orchestrator and models, with knowledge, actions and autonomy. Build it with Copilot Studio, Agents SDK or Agents Toolkit."},{"e":["c2"],"n":["host"],"t":"You host it, for example on Azure App Service: extra hosting outside Microsoft 365, at extra cost."},{"e":["c3"],"n":["cr","ens"],"t":"It runs in Microsoft 365 Copilot, Teams and external apps, and you ensure compliance, security and RAI."}],"a4":[{"e":["lce0","lce1","lce2","lce3"],"seq":true,"n":["lc0","lc1","lc2","lc3","lc4"],"t":"The lifecycle: build, preview, evaluate, publish, then monitor."},{"e":["ine0","ine1","ine2","ine3","ine4"],"n":["in0","in1","in2","in3","in4","plan"],"t":"On the Build tab, instructions, knowledge, skills, the model and memory (preview) feed the orchestration runtime."},{"n":["plan"],"t":"The Microsoft Copilot harness plans, reasons, retries and adapts in agentic loops, sharing context with subagents."},{"n":["sbx","hooks"],"t":"A secure sandbox creates and edits Word, Excel, PowerPoint and PDF files and runs code. Hooks (preview) run workflows at session start, before or after tools, and on errors."},{"e":["et","ec"],"back":true,"n":["tools","conn"],"t":"It calls tools (connectors, MCP servers, workflows) and connected agents (Copilot Studio, Foundry, A2A, Microsoft 365 Agents SDK), one level deep."},{"e":["ech"],"n":["chan"],"t":"Publish to channels: Microsoft Copilot, Teams, a demo website or a web app. MCP client and A2A client channels are in preview."},{"e":["emon"],"n":["mon","ppac"],"t":"The Monitor tab shows health, outcomes, sessions and credit usage. The Power Platform admin center manages environments, data policies and Copilot Credits, billed from build time on this harness."}],"a5":[{"e":["ca0","ca1","ca2"],"back":true,"n":["buddy","sa0","sa1","sa2"],"t":"Agent Builder: Onboarding Buddy grounds answers in SharePoint (100 files, 1 list) and OneDrive (50 files), Teams (5 chats, 5 meetings) and Outlook email (the whole mailbox)."},{"e":["ca3","ca4","ca5"],"back":true,"n":["buddy","sa3","sa4","sa5"],"t":"It can also use up to 20 embedded files, up to 4 public websites, and admin-enabled Copilot connectors and Dataverse. Answers respect each user's permissions and sensitivity labels."},{"e":["cb0","cb1","cb2"],"back":true,"n":["orch","sb0","sb1","sb2"],"t":"Copilot Studio, Microsoft Copilot harness: uploaded files, SharePoint and OneDrive for Business, and public websites."},{"e":["cb3","cb4","cb5"],"back":true,"n":["orch","sb3","sb4","sb5"],"t":"Also Salesforce, ServiceNow and Azure SQL; Azure DevOps or a custom connector on the Advanced tab; Graph connectors and Dataverse. Admins can block source types per environment."}],"a6":[{"e":["s1"],"n":["req","ly0"],"t":"A request arrives. Only each skill's front matter (name and description, about 100 tokens) is always loaded; the description triggers the skill."},{"e":["s2"],"n":["ly1"],"t":"When it matches, the SKILL.md body loads: steps, format and rules, ideally under 5,000 tokens."},{"e":["s3"],"n":["ly2"],"t":"Files in references/ load on demand, only if needed."},{"e":["s4"],"n":["ly3"],"t":"Scripts in scripts/ are executed, not loaded into context. In declarative agents they run in a sandbox with no network or package installs."},{"n":["wab","wcs","wcw"],"t":"Where skills live: Agent Builder (8 per agent), the Copilot Studio Build tab, and Cowork (up to 50). Only what's needed enters the context window."}],"a7":[{"e":["abe0"],"n":["ab0","ab1"],"t":"Agent Builder: create the agent (private to you), then share it with Can chat or Can edit."},{"e":["abe1","abe2"],"seq":true,"n":["ab2","ab3"],"t":"Optionally share it org-wide (admins can limit this), and submit it to the org catalog after the first publish."},{"e":["abe3","abe4"],"seq":true,"n":["ab4","ab5"],"t":"An admin reviews it in the Microsoft 365 admin center. Once approved, it appears in the Agent Store as built by your org."},{"e":["cse0","cse1"],"seq":true,"n":["cs0","cs1","cs2"],"t":"Copilot Studio: save a draft on the Build tab, test it in Preview and Evaluate, then publish, which creates a new version."},{"e":["cse2","cse3","cse4"],"seq":true,"n":["cs3","cs4","cs5"],"t":"Turn on channels (Copilot, Teams, web) and share with users, groups or org end-user access; the org catalog needs admin approval."},{"h":["g1","g2"],"n":["dlp","reg"],"t":"Governance: data policies in the Power Platform admin center can block channels, and the Agent 365 agent registry tracks owners, usage, risk signals (Defender, Entra, Purview) and Copilot Credit costs."}],"a8":[{"h":["eo1","eo2"],"n":["entra","conn"],"t":"Authentication: an OAuth 2.0 client in a Microsoft Entra app registration (register the callback URL), or an API key."},{"e":["e1","e2"],"seq":true,"r":["e2","e1"],"tag":"tools/list","rtag":"tools","n":["orch","conn","tools"],"b":["b1"],"t":"① Discover: the agent, an MCP client, asks the server for its tools (tools/list) through a Power Platform connector, so data policies apply."},{"e":["e1","e2"],"seq":true,"tag":"tools/call","n":["orch","conn","tools","host"],"b":["b2"],"t":"② Invoke: the agent calls a tool (tools/call) over Streamable HTTP, using JSON-RPC 2.0 and HTTPS."},{"e":["e3"],"r":["e3","e2","e1"],"rtag":"result","n":["host","hr"],"t":"Your server, for example on Azure Container Apps, reads the HR system of record with least-privilege access, and the result flows back to the agent."},{"e":["em"],"n":["m365mcp","orch"],"t":"Microsoft 365 MCP servers from the gallery, for example Mail, connect with the signed-in identity on the Microsoft Copilot harness."},{"e":["ec"],"n":["cowork","tools"],"t":"The same server can back a Copilot Cowork plugin connector, where readOnlyHint and destructiveHint drive confirmations."}],"a9":[{"e":["e0"],"n":["user","orch"],"t":"A user asks Onboarding Orchestrator, the primary agent, in Microsoft Copilot or Teams."},{"e":["eo"],"n":["other","orch"],"t":"It can also connect Copilot Studio agents (same environment), Microsoft Foundry and Microsoft 365 Agents SDK agents, and it routes by each connected agent's name and description."},{"e":["e1"],"r":["e1"],"rtag":"agent card","n":["orch","card"],"t":"① It reads Kubo's agent card at /.well-known/agent-card.json: name, description, endpoint and capabilities."},{"e":["e2"],"tag":"task","n":["orch","kubo"],"t":"② It sends the task and context to Kubo, an A2A agent on any framework, hosted outside Copilot Studio."},{"e":["e3"],"tag":"result","n":["kubo","orch"],"t":"③ Kubo returns the result. One level only: Kubo can't call another connected agent."},{"e":["e4"],"tag":"answer","n":["orch","user"],"t":"④ The orchestrator answers the user."},{"n":["auth","dev","aoai"],"t":"Authentication: none, API key or OAuth 2.0 (register the generated redirect URL in your app registration). For dev and test, Learn's sample uses Dev Tunnels and an Azure OpenAI model."}],"a10":[{"n":["chat","cowork","code"],"t":"One app, three modes: Chat to ask, research and use agents; Cowork does tasks for you, with approvals; Code (Frontier) builds software with a live preview."},{"e":["ew"],"back":true,"n":["wiq"],"t":"All three use Work IQ context with your permission: mail, calendar, files, meetings, chats and people."},{"e":["ecw"],"n":["cowork","cw0","cw1","cw2","cw3"],"t":"Cowork: built-in skills plus up to 50 custom ones, plugins (skills and MCP connectors), approvals for Send, Post and Create (pause or cancel), and scheduled or event-driven automations."},{"e":["ecd"],"n":["code","cd0","cd1","cd2","cd3"],"t":"Code: a local project folder or an isolated cloud, GitHub branches, commits and draft PRs, and Copilot Managed Runtime to publish interactive apps to your org. Same plugins as Cowork, plus web search and image generation."},{"e":["em1","em2"],"n":["mcp","cw1","cd3"],"t":"Your MCP server: one connector, used by plugins in both Cowork and Code."}],"a11":[{"e":["e0"],"n":["start","q0"],"t":"Start with what you need. First question: an external channel, or customers?"},{"e":["y1"],"n":["q0","cs"],"t":"Yes → Copilot Studio. Check that the harness supports your channel and authentication."},{"e":["n1","y2"],"seq":true,"n":["q1","cs"],"t":"No → external actions, workflows, or dev, test and prod ALM? Yes → Copilot Studio."},{"e":["n2","y3"],"seq":true,"n":["q2","ab"],"t":"No → are instructions, Microsoft 365 knowledge and built-in capabilities enough? Yes → Agent Builder: a declarative agent you share or submit to the org catalog."},{"e":["n3","y4"],"seq":true,"n":["q3","ce"],"t":"No → do you need full control of orchestration, models and hosting? Yes → a custom engine agent with the Microsoft 365 Agents SDK; you host it and own compliance."},{"e":["n4"],"n":["q3","cs"],"t":"No → Copilot Studio: Customer Conversation harness for customer chat and voice, standard for bounded, predictable flows, Microsoft Copilot harness for long, reasoning-heavy, file-heavy work."},{"n":["na"],"t":"Not building an agent? Do the work yourself in Copilot Cowork, or build a small app with Copilot Code (Frontier). Audience size alone doesn't decide."}]}};</script>
<script>(function(){
"use strict";
var D = window.COMIC, IMG = window.IMG;
var CH = D.chapters, S = D.sources;
var app = document.getElementById("app");
var bar = document.getElementById("progress");
var sel = document.getElementById("chap");
var guide = document.getElementById("guide");
var gtip = document.getElementById("gtip");
var state = {ci: -1, pi: 0, rev: 0, quiz: {}};
var anim = null;
var AUTO = {on: false, t: null, st: [], speed: 1};
var SPEEDS = [0.75, 1, 1.5, 2];
try { var sp0 = parseFloat(localStorage.getItem("agentup-speed")); if (SPEEDS.indexOf(sp0) >= 0) AUTO.speed = sp0; } catch (e) {}
function ms(x){ return Math.round(x / AUTO.speed); }
function readMs(t){ var n = String(t || "").length; return Math.min(12000, Math.max(2400, 1100 + 40 * n)); }
function rmOn(){ return document.documentElement.classList.contains("rm"); }
var NAMES = {sari:"Dewi", nova:"Nova", orbi:"Orbi", kubo:"Kubo", lina:"Lina (IT admin)", oni:"Oversharing Oni", vague:"Vague-o", muncher:"Credit Muncher"};
var FLAT = [];
CH.forEach(function(c, ci){ c.pages.forEach(function(p, pi){ FLAT.push([ci, pi]); }); });

function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === "class") e.className = attrs[k]; else if (k === "style") e.setAttribute("style", attrs[k]); else e.setAttribute(k, attrs[k]);
  });
  if (html !== undefined && html !== null) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function img(name, cls, alt){ var i = el("img", {class: cls || "", alt: alt || "", src: IMG[name] || ""}); i.decoding = "async"; return i; }
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function stopAnim(){ if (anim) { cancelAnimationFrame(anim); anim = null; } }
function toast(t){ var x = el("div", {class:"toast", role:"status"}, esc(t)); document.body.appendChild(x); setTimeout(function(){ x.remove(); }, 2200); }
function setTip(t){ gtip.textContent = t; }

/* ---------- chapter select ---------- */
CH.forEach(function(c, ci){ var o = el("option", {value: String(ci)}, esc(c.num + ": " + (c.short || c.title))); sel.appendChild(o); });
sel.addEventListener("change", function(){ go("#/c" + sel.value + "/0"); });

/* ---------- sources strip ---------- */
function srcStrip(keys){
  if (!keys || !keys.length) return null;
  var w = el("div", {class: "srcs"});
  w.appendChild(el("b", null, "Microsoft Learn sources for this page"));
  var ul = el("ul");
  keys.forEach(function(k){
    var s = S[k]; if (!s) return;
    var li = el("li");
    li.innerHTML = '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a><span>' + (s[2] ? "updated " + esc(s[2]) : "retrieved 2026-11-15") + '</span>';
    ul.appendChild(li);
  });
  w.appendChild(ul);
  return w;
}

/* ---------- FX ---------- */
function sparkle(box){
  var c = el("canvas"); box.appendChild(c);
  var ctx = c.getContext("2d"), P = [];
  function size(){ c.width = box.clientWidth; c.height = box.clientHeight; }
  size();
  for (var i = 0; i < 42; i++) P.push({x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 2.2, s: 0.0006 + Math.random() * 0.0016, t: Math.random() * 6.28});
  function tick(){
    if (!c.isConnected) return;
    if (c.width !== box.clientWidth) size();
    ctx.clearRect(0, 0, c.width, c.height);
    P.forEach(function(p){
      p.y -= p.s; p.t += 0.05; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      var a = 0.35 + 0.35 * Math.sin(p.t);
      ctx.beginPath(); ctx.fillStyle = "rgba(200,255,250," + a.toFixed(3) + ")";
      ctx.arc(p.x * c.width, p.y * c.height, p.r, 0, 6.283); ctx.fill();
    });
    anim = requestAnimationFrame(tick);
  }
  if (!rmOn()) tick();
}
function fx(panel, list){
  var box = el("div", {class: "fx", "aria-hidden": "true"}); panel.appendChild(box);
  (list || []).forEach(function(f){
    var parts = f.split(":"), k = parts[0], v = (parts[1] || "").split(",").map(Number);
    if (k === "sparkle") sparkle(box);
    else if (k === "glow") box.appendChild(el("div", {class: "glow", style: "left:" + v[0] + "%;top:" + v[1] + "%"}));
    else if (k === "pulse") box.appendChild(el("div", {class: "pulse", style: "left:" + v[0] + "%;top:" + v[1] + "%"}));
    else if (k === "flow") { for (var j = 0; j < 2; j++) box.appendChild(el("div", {class: "fdot", style: "--x1:" + v[0] + "%;--y1:" + v[1] + "%;--x2:" + v[2] + "%;--y2:" + v[3] + "%;--d:" + (2.2 + j * 0.7) + "s;animation-delay:" + (j * 1.1) + "s"})); }
    else if (k === "confetti") {
      var cols = ["#ff5fa2", "#19d3c5", "#ffb547", "#8b6cff", "#4f8cff", "#2fd38a"];
      for (var i = 0; i < 46; i++) box.appendChild(el("div", {class: "conf", style: "left:" + (Math.random() * 100).toFixed(1) + "%;background:" + cols[i % cols.length] + ";--d:" + (3 + Math.random() * 3).toFixed(2) + "s;animation-delay:-" + (Math.random() * 5).toFixed(2) + "s"}));
    }
  });
}

/* ---------- page renderers ---------- */
function scene(p, back){
  var wrap = el("div");
  var panel = el("div", {class: "panel", role: "button", tabindex: "0", "aria-label": "Comic panel. Activate to continue."});
  panel.appendChild(img(p.img, "pi " + (p.kb || "kb-a"), p.caption || ""));
  fx(panel, p.fx);
  if (p.caption) panel.appendChild(el("div", {class: "cap"}, esc(p.caption)));
  var dlg = el("div", {class: "dlg", "aria-live": "polite"});
  var n = p.bubbles ? p.bubbles.length : 0;
  state.rev = back ? n : 0;
  (p.bubbles || []).forEach(function(b, i){
    var tail = b.tail || "b50", side = tail.charAt(0), at = tail.slice(1) || "50";
    var vill = ["oni", "vague", "muncher"].indexOf(b.who) >= 0;
    var bub = el("div", {class: "bub" + (vill ? " v" : "") + (i < state.rev ? "" : " hid"), style: "left:" + b.x + "%;top:" + b.y + "%;width:" + b.w + "%", "data-i": String(i)});
    bub.innerHTML = '<span class="who ' + b.who + '">' + esc(NAMES[b.who] || b.who) + "</span>" + esc(b.t) + '<i class="tl ' + side + '" style="--at:' + at + '%"></i>';

function sourcesView(){

/* ---------- auto-play ---------- */
var abtn = document.getElementById("autobtn"), sbtn = document.getElementById("speedbtn");
var apb = abtn ? abtn.querySelector(".ap") : null;
function barReset(){ if (!apb) return; apb.classList.remove("wait"); apb.style.transition = "none"; apb.style.width = "0"; }
function barRun(t){ if (!apb) return; barReset(); void apb.offsetWidth; apb.style.transition = "width " + t + "ms linear"; apb.style.width = "100%"; }
function barWait(){ if (!apb) return; barReset(); apb.classList.add("wait"); }
function autoClear(){ clearTimeout(AUTO.t); AUTO.t = null; AUTO.st.forEach(function(x){ clearTimeout(x); }); AUTO.st = []; }
function setSpeed(v){
  if (SPEEDS.indexOf(v) < 0) v = 1;
  AUTO.speed = v;
  if (sbtn) { sbtn.textContent = v + "×"; sbtn.setAttribute("aria-label", "Auto-play speed " + v + "×"); }
  try { localStorage.setItem("agentup-speed", String(v)); } catch (e) {}
}
function autoSet(on, quiet){
  AUTO.on = !!on;
  autoClear(); barReset();
  document.body.classList.toggle("autoon", AUTO.on);
  if (abtn) {
    abtn.setAttribute("aria-pressed", AUTO.on ? "true" : "false");
    abtn.querySelector(".ai").textContent = AUTO.on ? "⏸" : "▶";
    abtn.querySelector(".al").textContent = AUTO.on ? "Pause" : "Auto-play";
  }
  if (stageNode && stageNode._tf) stageNode._tf.onCycle = null;
  if (AUTO.on) {
    if (!quiet) toast("Auto-play on. Press A to pause.");
    if (state.ci < 0) { go("#/c0/0"); return; }
    autoKick();
  } else if (!quiet) { toast("Auto-play paused"); setTip("Auto-play paused. Press A to resume."); }
}
function autoKick(){
  autoClear(); barReset();
  if (!AUTO.on || state.ci < 0 || document.hidden) return;
  setTip("Auto-play is on. Press A to pause, or → to skip ahead.");
  var plan = autoPlan();
  if (plan.wait) { barWait(); return; }
  barRun(plan.ms);
  if (plan.scroll) autoScroll(plan.ms);
  AUTO.t = setTimeout(function(){ AUTO.t = null; if (AUTO.on) plan.fn(); }, plan.ms);
}
function autoPlan(){
  var c = CH[state.ci], p = c.pages[state.pi], s = stageNode;
  var last = state.ci === CH.length - 1 && state.pi === c.pages.length - 1;
  var done = last ? function(){ autoSet(false, true); toast("The end! Auto-play stopped."); setTip("That's the end. Press A to play it again."); } : next;
  if (p.type === "scene") {
    var bb = p.bubbles || [], n = bb.length;
    if (state.rev < n) return {ms: ms(state.rev ? readMs(bb[state.rev - 1].t) : 1800), fn: next};
    return {ms: ms(n ? readMs(bb[n - 1].t) + 400 : 4500), fn: done};
  }
  if (s && s._tf) {
    if (s._tf.seen) return {ms: ms(1500), fn: done};
    s._tf.onCycle = function(){
      if (!AUTO.on || stageNode !== s || document.hidden) return;
      barRun(ms(1200));
      AUTO.t = setTimeout(function(){ AUTO.t = null; if (AUTO.on && stageNode === s) done(); }, ms(1200));
    };
    var h = s.querySelector(".tfhost"), g = s.querySelector("svg");
    if (h && g) AUTO.st.push(setTimeout(function(){ fitView(h, g); }, 300));
    return {wait: true};
  }
  if (s && s._qleft) {
    var qs = p.qs, k = qs.length - s._qleft();
    if (k < qs.length) return {ms: ms((k ? readMs(qs[k - 1].why) : 0) + readMs(qs[k].q) + 1500), fn: function(){ s._qnext(); autoKick(); }};
    return {ms: ms(readMs(qs[qs.length - 1].why) + 600), fn: done};
  }
  var txt = s ? String(s.textContent || "").replace(/\s+/g, " ") : "";
  return {ms: ms(Math.min(32000, Math.max(6000, 2500 + 20 * txt.length))), fn: done, scroll: true};
}
function fitView(top, bottom){
  if (!top.getBoundingClientRect) return;
  var hd = document.querySelector(".top"), off = (hd ? hd.offsetHeight : 0) + 8;
  var need = bottom.getBoundingClientRect().bottom - window.innerHeight + 12, room = top.getBoundingClientRect().top - off;
  var dy = Math.min(need, room);
  if (dy > 4) window.scrollTo({top: window.scrollY + dy, behavior: "smooth"});
}
function autoScroll(total){
  var stg = app.querySelector(".stage");
  if (!stg || !stg.getBoundingClientRect) return;
  var over = stg.getBoundingClientRect().bottom - window.innerHeight + 24;
  if (!(over > 0)) return;
  var n = Math.max(1, Math.ceil(over / (window.innerHeight * 0.6)));
  for (var i = 1; i <= n; i++) AUTO.st.push(setTimeout(function(){ if (AUTO.on) window.scrollBy({top: over / n, behavior: "smooth"}); }, total * i / (n + 1)));
}
function route(){
  var h = location.hash || "#/";
  var m = h.match(/^#\/c(\d+)\/(\d+)$/);
  var back = backNav; backNav = false;
  if (m) { var ci = Math.min(+m[1], CH.length - 1); var pi = Math.min(+m[2], CH[ci].pages.length - 1); page(ci, pi, back); }
  else if (h === "#/sources") sourcesView();
  else cover();
  window.scrollTo(0, 0);
  if (AUTO.on) { if (state.ci >= 0) autoKick(); else autoSet(false, true); }
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", function(e){
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight" || (e.key === " " && state.ci >= 0 && e.target === document.body)) { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  else if (e.key === "Home") go("#/");
  else if ((e.key === "a" || e.key === "A") && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); autoSet(!AUTO.on); }
  else if ((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey && !e.altKey && window.AGENTUP_MOTION) { e.preventDefault(); window.AGENTUP_MOTION.set(rmOn()); }
});
var tx = null;
app.addEventListener("touchstart", function(e){ tx = e.changedTouches[0].clientX; }, {passive: true});
app.addEventListener("touchend", function(e){ if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) { if (dx < 0) next(); else prev(); } tx = null; }, {passive: true});
document.getElementById("brand").addEventListener("click", function(){ go("#/"); });
document.getElementById("srcbtn").addEventListener("click", function(){ go("#/sources"); });
guide.querySelector("img").addEventListener("click", function(){ guide.classList.toggle("min"); });
if (abtn) abtn.addEventListener("click", function(){ autoSet(!AUTO.on); });
if (sbtn) sbtn.addEventListener("click", function(){ var i = SPEEDS.indexOf(AUTO.speed); setSpeed(SPEEDS[(i + 1) % SPEEDS.length]); toast("Auto-play speed " + sbtn.textContent); if (AUTO.on) autoKick(); });
document.addEventListener("visibilitychange", function(){ if (document.hidden) { autoClear(); barReset(); } else if (AUTO.on && state.ci >= 0) autoKick(); });
setSpeed(AUTO.speed);
document.addEventListener("agentup-motion", function(){ toast(rmOn() ? "Animations off. Press M to turn them back on." : "Animations on"); route(); });
var hdr = document.querySelector(".top");
function setHdr(){ if (hdr) document.documentElement.style.setProperty("--hdrh", (hdr.offsetHeight + 6) + "px"); }
setHdr(); window.addEventListener("resize", setHdr);
route();
(function(){
  var qs = location.search || "", m = qs.match(/[?&]speed=([0-9.]+)/);
  if (m) setSpeed(parseFloat(m[1]));
  if (/[?&]auto(play)?=(1|true|yes)(&|$)/i.test(qs)) autoSet(true, true);
})();
/* background preload of panel art (web build: images are separate files) */
(function(){
  var keys = Object.keys(IMG).filter(function(k){ return String(IMG[k]).indexOf("data:") !== 0; });
  var i = 0;
  function nxt(){ if (i >= keys.length) return; var im = new Image(); im.onload = im.onerror = function(){ setTimeout(nxt, 40); }; im.src = IMG[keys[i++]]; }
  setTimeout(nxt, 600);
})();
})();
